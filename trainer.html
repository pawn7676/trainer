     iPadOS rounds the corners itself, so icon.png is a plain

     both uses is not reliably honoured. iPadOS keeps the icon

     a new one, add the page again. -->

<link rel="icon" href="icon.png">
<!-- =================================================================
     INDEX
     =================================================================
     Every file lists its own sections in its header, numbered [#1],
     [#2], ... A reference to another file's section names the file -
     "board.js [#6]" - and a bare "[#6]" means a section of the file
     it's in.

     THE FILES - keep them all in the same folder as this page,
     except rules.js and pieces.js, which are in the shared folder
     (below):
      trainer.html ................... this page: the markup, and the
                                       chapters and gameplay below
      trainer.css .................... how the page looks; every
                                       color is in trainer.css [#2]
      errors.js ...................... error messages - every error
                                       stops the page until it's
                                       reloaded
      ../shared/rules.js ............. chess rules: legal moves, SAN,
                                       check and mate. NOT in this
                                       folder: it's in the folder
                                       "shared", next to this one -
                                       one copy for every project
                                       (see the top of rules.js)
      filter.js ...................... reads the two .jsonl files and
                                       builds the SR / random / puzzle
                                       / Library lists
      ../shared/pieces.js ............ piece artwork. NOT in this
                                       folder: it's in "shared",
                                       like rules.js (see the top
                                       of pieces.js)
      board.js ....................... the board: drawing, taps and
                                       drags, piece slides, resizing
      icons.js ....................... UI icons (data-icon="...")
      engine.js ...................... Stockfish analysis
      explorer.js .................... Lichess opening explorer, and
                                       the open line's Lichess data
                                       collected in the background
      data.html ...................... the data page, opened on its
                                       own (not by this page): takes
                                       the Lichess token, loads the
                                       openings, puzzles and
                                       explorer data files for the
                                       trainer, gathers the Lichess
                                       data and saves
                                       explorer_data.jsonl
      NotoSans.ttf ................... the page font (trainer.css
                                       [#1])
      icon.png ....................... the home-screen icon (and
                                       the browser tab's), 180x180
                                       - optional
      stockfish-19-lite-single.js .... engine (Lite)
      stockfish-19-lite-single.wasm .. engine (Lite), used by the .js
      stockfish-19-single.js ......... engine (Full, optional - only
                                       with ENGINE_TYPE set to "full"
                                       at the top of engine.js)
      stockfish-19-single.wasm ....... engine (Full), used by the .js
      LICENSE ........................ the GNU GPL v3: the license of
                                       the trainer's own code, and of
                                       Stockfish
      CREDITS.md ..................... who made what (Stockfish, the
                                       pieces, the font, the icons,
                                       Lichess, python-chess), with
                                       their licenses
      NotoSans-OFL.txt ............... the font's license
      index.html ..................... sends the site's short
                                       address on to this page (for
                                       a web host that would show
                                       README.md there instead)

     THIS FILE'S SECTIONS (in the <script> at the bottom)
     CHAPTERS & FILES - which chapter is on the board
      [#1]  CHAPTER STATE ........ the list, the open chapter, mode
      [#2]  CHAPTER LIST ......... builds the list; the mode menu
      [#3]  SR DATE .............. the date picked in Settings; a
                                   new day rebuilds the list;
                                   today (realToday, todayString)
      [#4]  OPENING A CHAPTER .... loadChapter, clearBoard, the
                                   remembered last chapter
      [#5]  CHAPTER DROPDOWN ..... the Chapter <select>, Link button;
                                   the Library's color square and
                                   Study dropdown; the SR / Random
                                   chapter carried into the Library
      [#6]  NEXT CHAPTER ......... the end of a line (>> becomes
                                   Next), p and n stepping
      [#7]  TRAINER FILES ........ the two files the lists come from
      [#8]  FILE CACHE (INDEXEDDB)  where data.html keeps
                                   both files
      [#9]  NO FILE YET .......... what the board says with nothing
                                   to show
      [#10] STARTUP LOAD ......... reads both saved files at launch

     GAMEPLAY & APP - how it's played, and the app around it
      [#11] HELPERS .............. el, bindTap, TAP_SLOP, no
                                   double-tap zoom
      [#12] GAME STATE ........... where you are; practice or browse
      [#13] NAVIGATION ........... goToPly, prev/next, button states
      [#14] ANALYSIS LINE ........ free play off the book line,
                                   tapped engine-line and explorer
                                   moves
      [#15] PRACTICE MODE ........ the Play/Stop button
      [#16] MOVE CHECK & AUTO-PLAY  your move vs book, wrong-move
                                   retry, the opponent's reply
      [#17] ANNOTATION COLORS .... !!/!/etc. colors (move list,
                                   comment text, badges)
      [#18] COMMENT BOX .......... comment and ALT box, scroll cue
      [#19] MOVE LIST ............ sidebar move-pair list
      [#20] SIDEBAR HEIGHT ....... sidebar kept within the board's
                                   height
      [#21] SETTINGS ............. saved settings, Show... switches,
                                   the gear menu
      [#22] ENGINE & EXPLORER .... in engine.js and explorer.js;
                                   hooks listed here
      [#23] BUTTON WIRING ........ buttons and on-screen controls
      [#24] KEYBOARD SHORTCUTS ... arrows, p and n chapters, Space,
                                   t practice, l engine, x threat,
                                   a arrows, e explorer; the keys
                                   for Settings switches (m, b, g,
                                   i, o); c comments
      [#25] BOOT & STOP .......... start-up; what an error halts
    ============================================================ -->

     from its Home Screen icon (navigator.standalone - false in a
     Safari tab), the page gets the class "web-app", which gives it

     trainer.css [#2]). Here, before the stylesheet, so the room is
     there from the first frame. -->

if (navigator.standalone) document.documentElement.classList.add("web-app");
</script>

  window.pageStopped = function () { return true; };
  window.checkExternalFiles = function () { return false; };
  alert("errors.js is missing - keep it in the same folder as this page. The trainer can't run without it.");
}

<script>
/*==================================================================
 * CHAPTERS & FILES - sections [#1]-[#10]
 * WHICH chapter is on the board: the chapter list for the current
 * mode (picked in the mode menu) and the SR date, the Chapter
 * dropdown and Link button (and the Library's color square and
 * Study dropdown), opening a chapter and moving on to the next one, and
 * the two trainer files the lists come from (openings.jsonl and
 * puzzles.jsonl, written by the Python build scripts, and loaded on
 * data.html). HOW the open chapter is played is GAMEPLAY & APP,
 * below.
 *
 * Reading the files and building the lists is done by filter.js.
 * This part only asks it for:
 *   FILTER.read(text, kind) ............. a saved file -> its pool
 *                                         ([#7])
 *   FILTER.list(mode, pool, date, pick) . the list for a mode ([#2])
 *   FILTER.studies(pool, side) .......... the Library's Study
 *                                         dropdown ([#5])
 * See filter.js for the details, the daily shuffle and the SR
 * schedule. The chapters themselves are used as they come: the
 * build already checked every one with python-chess
 * (jsonl_writer.py [#8]).
 *
 * A CHAPTER is an object straight from the file, with these fields
 * (a field at its default is left out of the file - read a missing
 * one as its default; jsonl_writer.py [#2] and the README list
 * them all):
 *   study, chapter ........ its Lichess study's and chapter's names
 *   id .................... its Lichess study and chapter IDs,
 *                           "FjELOsQl/HBcwXFLi" - its identity
 *                           (chapterKey, [#4]) and its link
 *                           (LICHESS_STUDY_URL + id, [#5])
 *   heading ............... the heading it's under in its study
 *                           (openings only; the Library groups by
 *                           it - [#5])
 *   side .................. "w"/"b": the side you play
 *   date .................. "YYYY-MM-DD": the day its spaced
 *                           repetition starts
 *   fen ................... its starting position (left out = the
 *                           normal start)
 *   blindfold ............. true for a blindfold puzzle ([#12])
 *   info .................. true for an INFO chapter - left out
 *                           of Random openings only (filter.js)
 *   preamble .............. text shown before move 1
 *   moves ................. each { uci, annotation, eval, comment,
 *                           circles, arrows, altUci, end }
 * The file names no move: a move is only its uci. When a chapter
 * opens, nameMoves ([#4]) adds each move's name to it - san ("Nf3",
 * "O-O", "Qh2#") and altSan (its ALT: moves', "...Nf6" for Black's) -
 * and everything here reads those.
 *==================================================================*/

/*==================================================================
 * [#1] CHAPTER STATE — the chapter list for the current mode, the
 * chapter that's open, and the list mode.
 *==================================================================*/
var chapters = [];       // the list for the current mode ([#2])
var currentChapter = 0;  // the open chapter: its index in `chapters`
// The open chapter's moves and the side you play in it (its
// "side": "w" or "b") - both set by loadChapter ([#4]).
var chapterMoves = [];
var side = "w";

// Four list modes, picked in the mode menu (the mode button, [#2]),
// in the menu's order:
//   "sr"      - spaced-repetition list from the openings file
//   "random"  - today's random 50 from the openings file
//   "library" - chapters you pick yourself from the openings file:
//               one study's chapters of one color ([#5])
//   "puzzle"  - today's random 50 from the puzzles file (no SR)
var LIST_MODES = ["sr", "random", "library", "puzzle"];
// The current mode. Saved; restored at boot by loadSavedSettings
// ([#21]).
var listMode = "sr";

// What's picked in the Library's color square and Study dropdown
// ([#5]): side "w"/"b" (White to start with), and for each color the
// study picked with it - w and b, a study's name or "" for none yet.
// Each color keeps its own study, so switching to Black and back to
// White finds White's study still there. (The chapter you had open
// is remembered for each color too - [#4].) Saved; restored at boot
// by loadSavedSettings ([#21]).
var libraryPick = { side: "w", w: "", b: "" };

// Which file (pool slot, see [#7]) a list mode draws from.
function listSlot() { return listMode === "puzzle" ? "puzzles" : "openings"; }

/*==================================================================
 * [#2] CHAPTER LIST — (re)builds `chapters` for the current mode
 * from its file's pool ([#7]), and the mode button with its menu,
 * where the mode is picked.
 *==================================================================*/
// The list itself comes from filter.js. srViewDate is
// only used for the SR list, libraryPick only for the Library's -
// its color, and the study picked with that color.
function buildChapterList() {
  var pick = { side: libraryPick.side, study: libraryPick[libraryPick.side] };
  return FILTER.list(listMode, pools[listSlot()], srViewDate, pick);
}

// Re-derives the chapter list from the already-loaded pool (no
// refetch) and reloads the dropdown/board - used at startup, when
// a mode is picked in the mode menu (except SR or Random -> Library
// with a chapter open, which keeps the board as it is -
// carryChapterToLibrary, [#5]), when the SR date changes, and when
// the Library's color or study is changed ([#5]).
function refreshChapterList() {
  chapters = buildChapterList();
  updateLibraryRow();
  populateChapterSelect();
  if (!chapters.length) {
    var slot = listSlot();
    clearBoard(!pools[slot].length
      ? noFileText(slot) // ([#9])
      : listMode === "sr"
        ? "No chapters due for spaced repetition today."
        : listMode === "library"
          ? "Pick a study." // (the Library's Study dropdown, [#5])
          : "No chapters selected for study.");
    return;
  }
  var idx = findRememberedChapterIndex();
  loadChapter(idx >= 0 ? idx : 0);
}

// Each mode's icon (from icons.js) and name. The mode button shows
// the active mode's icon; the mode menu shows every mode's icon and
// name.
var LIST_MODE_INFO = {
  sr:      { icon: "calendar", name: "Spaced repetition" },
  random:  { icon: "shuffle",  name: "Random openings" },
  puzzle:  { icon: "puzzle",   name: "Puzzles" },
  library: { icon: "library",  name: "Library" }
};
function updateListModeButton() {
  var info = LIST_MODE_INFO[listMode];
  var btn = el("btnListMode");
  btn.innerHTML = icon(info.icon);
  btn.title = "Mode: " + info.name;
}

// ---- The mode menu ---------------------------------------------
// The mode button opens it: a pop-up over the bottom of the board,
// like the Settings menu ([#21]) - same look (trainer.css [#9]), and
// tapping outside it closes it. One row per mode, in LIST_MODES
// order, each its icon and name; the active mode's row is lit up.
// Tapping a row picks that mode and closes the menu (tapping the
// active one just closes it).

// Makes the rows, once, from LIST_MODES and LIST_MODE_INFO - so the
// names and icons are only written down there. Called by wireUI
// ([#23]), which also wires the backdrop (wireModeMenu, below).
function buildModeMenu() {
  var rows = el("modeMenuRows");
  LIST_MODES.forEach(function (m) {
    var info = LIST_MODE_INFO[m];
    var row = document.createElement("button");
    row.type = "button";
    row.className = "mode-row";
    row.dataset.mode = m;
    row.innerHTML = icon(info.icon);
    var name = document.createElement("span");
    name.textContent = info.name;
    row.appendChild(name);
    row.addEventListener("click", function () { pickListMode(m); });
    rows.appendChild(row);
  });
}

function openModeMenu() {
  // light up the active mode's row
  var rows = el("modeMenuRows").children;
  for (var i = 0; i < rows.length; i++) {
    rows[i].classList.toggle("active", rows[i].dataset.mode === listMode);
  }
  el("modeMenuBackdrop").classList.remove("hidden");
  positionModeMenu();
}
function closeModeMenu() { el("modeMenuBackdrop").classList.add("hidden"); }
function modeMenuOpen() { return !el("modeMenuBackdrop").classList.contains("hidden"); }

// Placed like the Settings menu - its bottom edge on the board's
// bottom edge - but with its left edge over the mode button's
// (placeMenu, [#21]).
function positionModeMenu() {
  placeMenu(el("modeMenu"), el("btnListMode").getBoundingClientRect().left);
}

// A mode picked in the mode menu. Library picked from Spaced
// repetition or Random openings, with a chapter open, opens on that
// same chapter, at the same move - nothing on the board changes, only
// the chapter row (carryChapterToLibrary, [#5]). From anywhere else
// (Puzzles, or an empty SR list) the Library opens as usual, on the
// chapter it remembers for its color.
function pickListMode(m) {
  closeModeMenu();
  if (m === listMode) return;
  var carry = m === "library" && (listMode === "sr" || listMode === "random") &&
    !!chapters[currentChapter];
  listMode = m;
  saveSetting("listMode", listMode);
  updateListModeButton();
  if (carry) carryChapterToLibrary();
  else refreshChapterList();
}

// The backdrop: tapping outside the menu closes it - "click", as
// for the Settings menu ([#21]), so the tap that closes it doesn't
// go through to whatever is underneath.
function wireModeMenu() {
  el("modeMenuBackdrop").addEventListener("click", function (e) {
    if (e.target === el("modeMenuBackdrop")) closeModeMenu();
  });
  window.addEventListener("resize", function () {
    if (modeMenuOpen()) positionModeMenu();
  });
}

/*==================================================================
 * [#3] SR DATE — the date picked with the arrows in Settings. It
 * only changes the SR list; the random openings and puzzles always
 * follow the real calendar date. The SR schedule itself is in
 * filter.js; the date row's buttons are wired with the rest of the
 * Settings panel ([#21]).
 *==================================================================*/
// Real calendar "today", zeroed to midnight - where srViewDate
// starts, and where tapping the date label jumps back to. The page's
// only one: filter.js uses it too (when it's called, never at load).
function realToday() {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// The same day as text, "YYYY-MM-DD" (the device's own calendar day) -
// the seed for the daily shuffle (filter.js [#2]), and the date on an
// explorer answer (explorer.js [#4]).
function todayString() {
  var d = realToday();
  var mm = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (mm < 10 ? "0" : "") + mm + "-" + (dd < 10 ? "0" : "") + dd;
}

// The date the SR list is built for (not the random lists - those
// always use the real date). Defaults to the real today on every
// fresh load (this is a plain var, never written to localStorage -
// see the settings-panel date nav below), and can be walked forward
// or backward via the Settings popup - backward to review what was
// due on a missed day, forward to preview what will be due later.
var srViewDate = realToday();

function isViewingToday() { return srViewDate.getTime() === realToday().getTime(); }

// Moves srViewDate by deltaDays (either direction - no clamping, so
// it can be browsed into the future as well as the past). Re-derives
// the chapter list so the change takes effect immediately, and
// refreshes the settings-panel date label.
function shiftSRViewDate(deltaDays) {
  var d = new Date(srViewDate);
  d.setDate(d.getDate() + deltaDays);
  srViewDate = d;
  updateDateNavUI();
  // date only affects the SR list
  if (listMode === "sr") refreshChapterList();
}

// "Sep 17" - no year, and no relative "Today"/"Yesterday" wording.
function formatDateNavLabel(d) {
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// Refreshes the Settings-panel date label to match srViewDate.
function updateDateNavUI() {
  el("dateNavLabel").textContent = formatDateNavLabel(srViewDate);
}

// A NEW DAY - the page can stay open for days, but the lists are only
// built when something asks for them (start-up, the mode button, the
// SR date, loading a file). So when the page comes back into view
// (switched back to, the device woken up) on a different calendar
// day than the list was built for, it's built again: the random
// openings and puzzles get the new day's shuffle (filter.js [#2]),
// and the SR date moves on to today - unless it had been stepped to
// another day in Settings, which is left where it was. Only the
// current mode's list is rebuilt; the others are built fresh anyway
// when the mode menu switches to them. Not on a timer: with the
// screen left on through midnight, it happens the next time the page
// comes back into view. Wired once, from boot ([#25]).
var listDay = realToday().getTime();

function wireDayChange() {
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || pageStopped()) return;
    var today = realToday().getTime();
    if (today === listDay) return;
    if (srViewDate.getTime() === listDay) {
      srViewDate = realToday();
      updateDateNavUI();
    }
    listDay = today;
    refreshChapterList();
  });
}

/*==================================================================
 * [#4] OPENING A CHAPTER — loadChapter opens one (and remembers
 * it, per mode, for next time), naming its moves first (nameMoves);
 * clearBoard is its opposite, for when the list is empty.
 *==================================================================*/
function loadChapter(idx) {
  // Nothing opens while an error has the page stopped (errors.js [#1]).
  if (pageStopped()) return;
  currentChapter = idx;
  nameMoves(chapters[idx]);
  chapterMoves = chapters[idx].moves;
  side = chapters[idx].side; // "w" or "b"
  BOARD.setOrientation(side);
  currentPly = 0;
  piecesHidden = isBlindChapter(); // a blindfold puzzle starts hidden ([#12])
  BOARD.clearSelection();
  el("chapterSel").value = idx;
  el("btnChapterLink").disabled = !chapters[idx].id;
  saveLastChapterKey(chapterKey(chapters[idx]));
  // The explorer works in an opening chapter only - never in a
  // puzzle - and the chapter's Lichess data is collected in the
  // background (explorer.js [#7], [#10]).
  EXPLORER.chapterOpened(listSlot() === "openings" ? chapters[idx] : null);
  // A new (or restarted) chapter never keeps the old analysis
  // line. The engine, if on, just moves on to the new position.
  clearAnalysis();
  renderMoveList();
  // Auto practice mode: back into Practice if you'd switched to
  // browse (setMode then goes to the chapter's start itself).
  if (autoPractice && mode !== "practice") { setMode("practice"); return; }
  goToPly(0, true);
}

// The file gives each move as its uci only (jsonl_writer.py [#2]).
// This adds the names the page shows, by replaying the chapter's
// line once with rules.js - the same SAN python-chess writes:
//   san ..... the move's name: "Nf3", "exd5", "O-O", "e8=Q+", "Qh2#"
//             - the move list ([#19]), and the check glow and badges
//             while a move slides in (board.js [#5])
//   altSan .. its ALT: moves' names, Black's with "..." in front
//             ("...Nf6") - the ALT box ([#18])
// Done the first time a chapter opens, and kept on it (the chapter
// is the pool's own object, so it's named once per file load).
function nameMoves(ch) {
  if (ch.named) return;
  var pos = new RULES.Position(ch.fen || undefined);
  for (var i = 0; i < ch.moves.length; i++) {
    var mv = ch.moves[i];
    var legal = pos.legalMoves();
    var m = pos.findUci(mv.uci, legal);
    if (!m) break; // (can't happen - the build checked every move)
    mv.san = pos.sanOf(m, legal);
    if (mv.altUci) {
      var dots = pos.turn === "b" ? "..." : "";
      mv.altSan = mv.altUci.map(function (uci) {
        var alt = pos.findUci(uci, legal);
        return alt ? dots + pos.sanOf(alt, legal) : uci;
      });
    }
    pos.apply(m);
  }
  ch.named = true;
}

// An empty list (no file loaded for this mode yet, or nothing
// due for SR) shows the plain starting position with nothing to play,
// rather than leaving the previous mode's chapter on the board.
function clearBoard(message) {
  settleBoard();
  BOARD.closePromoPicker();
  chapterMoves = [];
  currentPly = 0;
  piecesHidden = false;
  BOARD.clearSelection();
  game.pos = new RULES.Position();
  game.moves = [];
  el("btnChapterLink").disabled = true;
  clearAnalysis();
  ENGINE.shutDown(); // Nothing to analyze without a chapter
  EXPLORER.chapterOpened(null); // (no chapter: the explorer's off)
  EXPLORER.positionChanged(); // (shows nothing with no chapter)
  el("moveList").innerHTML = "";
  hideNoteGate();
  hideEndOfLine();
  updateControls();
  renderAltText(null);
  BOARD.render();
  showLoadPrompt(message);
  // (the boxes beside the board may have gone - refit the column, [#20])
  syncNotesHeight();
}

function showLoadPrompt(message) {
  var box = el("commentText");
  box.textContent = message;
  box.className = "empty";
}

// Stable identity for a chapter, independent of its index (which
// shifts around as the random-50/SR lists get rebuilt) - every
// chapter comes from a Lichess study and has its study and chapter
// IDs (id, "FjELOsQl/HBcwXFLi"), so that's a reliably unique key on
// its own.
function chapterKey(ch) {
  return ch.id;
}

// Remembers which chapter was last open, kept separately per list
// mode ("sr" / "random" / "puzzle") since they're different lists -
// and in the Library separately for each color ("library-w" /
// "library-b"), so switching color and back reopens the chapter you
// had open with that color. (Picking a different study opens its
// first chapter.)
// Saved with the other settings ([#21]) as "lastChapter".
function chapterMemorySlot() {
  return listMode === "library" ? "library-" + libraryPick.side : listMode;
}
function saveLastChapterKey(key) {
  var last = loadSettings().lastChapter || {};
  last[chapterMemorySlot()] = key;
  saveSetting("lastChapter", last);
}
function loadLastChapterKey() {
  var last = loadSettings().lastChapter;
  return (last && last[chapterMemorySlot()]) || null;
}
// Index in the current `chapters` list of the remembered chapter for
// the active mode, or -1 if there isn't one (or it's no longer here).
function findRememberedChapterIndex() {
  var key = loadLastChapterKey();
  if (!key) return -1;
  for (var i = 0; i < chapters.length; i++) {
    if (chapterKey(chapters[i]) === key) return i;
  }
  return -1;
}

/*==================================================================
 * [#5] CHAPTER DROPDOWN & LINK — labels and fills the Chapter
 * <select>, and the Link button (in front of it) that opens the
 * chapter on Lichess. In Library mode, also the color square and the
 * Study dropdown in front of the Chapter one (see THE LIBRARY'S ROW,
 * below).
 *==================================================================*/
// Names come only from the study and chapter names.
// Chapters in the dropdown come from many different opening files
// at once, so the study name leads.
function chapterLabel(ch) {
  var study = (ch.study || "").trim();
  var chapter = (ch.chapter || "").trim();
  if (study && chapter) return study + ": " + chapter;
  return study || chapter || "Untitled chapter";
}

// With "Show name" off (showChapterName, [#21]) the label is
// just "#N", so the chapter's name isn't given away while it's
// being reviewed.
// In the Library it's just the chapter's name - no "#N", and no
// study (it has its own dropdown) - always: picking by name is what
// the Library is for, so the setting doesn't apply there.
function chapterOptionLabel(ch, i) {
  if (listMode === "library") return (ch.chapter || "").trim() || "Untitled chapter";
  var label = "#" + (i + 1);
  return showChapterName ? label + " · " + chapterLabel(ch) : label;
}

// Fills the Chapter dropdown from `chapters`. Each option's value is
// the chapter's index in `chapters`.
// In the Library, the chapters are grouped under their headings (a
// chapter's "heading", from the "_" chapters on Lichess): each run
// of chapters with the same heading goes in an <optgroup>, which the
// iPad shows as a grey section title that can't be picked. Chapters
// with no heading (before a study's first heading) sit outside any
// group. The order is the list's own, so Next chapter still goes
// straight down the list, through the headings. The other modes mix
// many studies, so they never group.
function populateChapterSelect() {
  var sel = el("chapterSel");
  sel.innerHTML = "";
  var group = null; // the <optgroup> being filled, if any
  chapters.forEach(function (ch, i) {
    var opt = document.createElement("option");
    opt.value = i;
    opt.textContent = chapterOptionLabel(ch, i);
    var heading = listMode === "library" ? (ch.heading || "") : "";
    if (!heading) {
      group = null;
      sel.appendChild(opt);
      return;
    }
    if (!group || group.label !== heading) {
      group = document.createElement("optgroup");
      group.label = heading;
      sel.appendChild(group);
    }
    group.appendChild(opt);
  });
  // The Library with no study picked yet: the dropdown says
  // "Chapter" and is greyed out (THE LIBRARY'S ROW, below).
  var waiting = listMode === "library" && !chapters.length;
  if (waiting) addOption(sel, "", "Chapter");
  sel.disabled = waiting;
  // Keeps the open chapter selected when the list is relabeled
  // in place (the "Show name" toggle) rather than rebuilt.
  if (currentChapter < chapters.length) sel.value = currentChapter;
}

// One <option> on the end of a dropdown.
function addOption(sel, value, text) {
  var opt = document.createElement("option");
  opt.value = value;
  opt.textContent = text;
  sel.appendChild(opt);
}

// ---- THE LIBRARY'S ROW -------------------------------------------
// In Library mode the chapter row holds:
//   the color square ... white or black - the side you play. White
//                        to start with; tap it to switch.
//   Study .............. every study with chapters of that color,
//                        A-Z (FILTER.studies)
//   Chapter ............ that study's chapters of that color, in file
//                        order - the Chapter dropdown itself, filled
//                        from `chapters` like in every mode
//                        (FILTER.list "library")
// The Chapter dropdown is greyed out, and says "Chapter", until a
// study is picked; Study says "Study" until then. Each color keeps
// its own study and chapter: switching color goes back to the study
// and chapter you last had with that color ([#1], [#4]). Picking a
// study opens its first chapter.
// Next (>> at the end of a line) and the p n keys go through that
// study's chapters ([#6]).
// The row runs the whole width of the page, the Link button first. In
// Library mode it's split where the board ends: the Link button, the
// color square and Study under the board, Chapter under the boxes
// beside it (in the narrow, stacked layout: split under the gap
// between << and < - trainer.css [#16]). A name too long for its
// dropdown is simply cut off at the edge (trainer.css [#8]).
// Shown only in Library mode: the row gets the class "library".
// Coming from Spaced repetition or Random openings, the Library opens
// on the chapter you were on, with the color and study set to match
// (carryChapterToLibrary, below).

// Shows the color square and refills the Study dropdown from
// libraryPick, and shows or hides them for the current mode. Called
// by refreshChapterList ([#2]), so it's up to date whenever the
// list is.
function updateLibraryRow() {
  var on = listMode === "library";
  el("chapterRow").classList.toggle("library", on);
  if (!on) return;
  var black = libraryPick.side === "b";
  var square = el("libraryColor");
  square.classList.toggle("black", black);
  square.title = black ? "Playing Black - tap for White" : "Playing White - tap for Black";
  square.setAttribute("aria-label", square.title);
  var studies = FILTER.studies(pools.openings, libraryPick.side);
  fillStudySelect(studies, libraryPick[libraryPick.side]);
}

// Fills the Study dropdown with the study names and selects
// `picked`. If `picked` isn't one of them (no study picked yet, or a
// study that's no longer in a newly loaded file), "Study" goes first
// as a choice of its own, and is what it shows.
function fillStudySelect(names, picked) {
  var sel = el("libraryStudy");
  sel.innerHTML = "";
  var found = names.indexOf(picked) !== -1;
  if (!found) addOption(sel, "", "Study");
  names.forEach(function (name) { addOption(sel, name, name); });
  sel.value = found ? picked : "";
}

// The color square tapped: the other color, with the study and
// chapter you last had with it (if any).
function switchLibraryColor() {
  libraryPick.side = libraryPick.side === "b" ? "w" : "b";
  saveSetting("libraryPick", libraryPick);
  refreshChapterList();
}

// A study picked: its chapters of that color become the list.
function pickLibraryStudy(study) {
  libraryPick[libraryPick.side] = study;
  saveSetting("libraryPick", libraryPick);
  refreshChapterList();
}

// Library picked in the mode menu from Spaced repetition or Random
// openings, with a chapter open (pickListMode, [#2] - listMode is
// already "library", but `chapters` is still the old mode's list):
// the Library opens on that same chapter. Its color and study become
// the chapter's own, and it becomes the chapter the Library remembers
// for that color - replacing whatever study and chapter were
// remembered there before.
// Only the chapter row changes (the color square, the Study dropdown,
// the Chapter dropdown with the study's chapters under their
// headings). It deliberately doesn't go through loadChapter or
// goToPly: the board, the move you're on, Practice or browse, the
// analysis line, an opponent reply still to come, the engine and the
// explorer all carry on as they were. Both lists come from the same
// openings pool, so the chapter is the very same object in the new
// list - chapterMoves and the rest still point at it.
// From here on Next and the p n keys go through that study's
// chapters, like any Library list. Picking Spaced repetition or
// Random openings again reopens the chapter you left, at its start
// (its own remembered chapter, [#4]).
function carryChapterToLibrary() {
  var ch = chapters[currentChapter];
  libraryPick.side = ch.side;
  libraryPick[ch.side] = ch.study;
  saveSetting("libraryPick", libraryPick);
  var list = buildChapterList();
  var idx = -1;
  for (var i = 0; i < list.length; i++) {
    if (chapterKey(list[i]) === chapterKey(ch)) { idx = i; break; }
  }
  // (can't happen - the chapter's own color and study always list it -
  // but if it ever did, the Library just opens the usual way)
  if (idx < 0) { refreshChapterList(); return; }
  chapters = list;
  currentChapter = idx;
  updateLibraryRow();
  populateChapterSelect();
  saveLastChapterKey(chapterKey(ch));
  // At the end of the line, Next (>>) now means the next chapter of
  // the study - or >> greys out, if it's the study's last.
  if (endOfLineShowing()) showEndOfLine();
}

// Every chapter's link is this plus its id ("FjELOsQl/HBcwXFLi") -
// the files hold only the id, so the link is written down only here.
var LICHESS_STUDY_URL = "https://lichess.org/study/";

// The Link button: the open chapter on Lichess, at the move on the
// board.
function openChapterLink() {
  var id = chapters[currentChapter] && chapters[currentChapter].id;
  if (!id) return;
  var url = LICHESS_STUDY_URL + id;
  if (currentPly > 0) url += "#" + currentPly;
  //window.open(url, "_blank", "noopener");
  // forces a web app to open a new tab in safari
  window.open(url.replace(/^https:/, "x-safari-https:"), "_blank", "noopener");
}

/*==================================================================
 * [#6] NEXT CHAPTER — the end of a line, where the >> button turns
 * into Next (the next-chapter icon, lit blue: the next chapter in the
 * list) - or, on the last one, stays >> and greys out - and stepping
 * through the list (the p and n keys, [#24]).
 *
 * The end of a line is the end of the BOOK line - on the analysis
 * line, >> stays >> (the end of your own line). Only >> moves on to
 * the next chapter (and the n key, [#24]) - not a tap on the comment
 * box, which there may be a long comment to scroll through. Going back
 * to the start is << - in Practice that plays the line again.
 *
 * For NEXT_LOCK_MS after >> turns into Next, taps on it are ignored,
 * so a quick double tap on >> (or a second tap right after your last
 * move) can't skip past the end of the line before you've seen it.
 * The look of Next is in trainer.css [#15].
 *==================================================================*/
var NEXT_LOCK_MS = 500;
var endOfLine = false;   // the board is at the end of the book line
var nextLockUntil = 0;   // >> as Next ignores taps until then

function isLastChapter() {
  return chapters.length === 0 || currentChapter >= chapters.length - 1;
}

// The end of the line reached (finishGoToPly, [#13]) - or, at the end
// already, the chapter list changed under it (carryChapterToLibrary,
// [#5]): >> becomes Next (or greys out on the last chapter).
function showEndOfLine() {
  if (!endOfLine) nextLockUntil = Date.now() + NEXT_LOCK_MS;
  endOfLine = true;
  updateControls();
}
function hideEndOfLine() {
  endOfLine = false;
  updateControls();
}
function endOfLineShowing() { return endOfLine; }

// >> as it looks now: », or at the end of the line Next (the
// next-chapter icon, lit like an "on" button) - but on the last
// chapter just », greyed out (there's no next one). Called by
// updateControls ([#13]), which has already greyed » out at the end
// of a line, so it only lights it up again for Next.
function updateEndButton() {
  var btn = el("btnEnd");
  var next = endOfLine && !isLastChapter();
  if (next) btn.disabled = false;
  if (btn.classList.contains("next-chapter") === next && btn.firstChild) return;
  btn.classList.toggle("next-chapter", next);
  if (next) btn.innerHTML = icon("next");
  else btn.textContent = "»";
  btn.title = next ? "Next chapter" : "End";
}

// The >> button: to the end of the line - or, there, Next (after its
// NEXT_LOCK_MS): the next chapter. Nothing on the last chapter.
function endButton() {
  if (!endOfLine) { navEnd(); return; }
  if (Date.now() < nextLockUntil || isLastChapter()) return;
  loadChapter(currentChapter + 1);
}

// Loads the chapter `delta` steps away in the current list (+1 next,
// -1 previous), or does nothing if that would run off either end.
function stepChapter(delta) {
  var idx = currentChapter + delta;
  if (idx < 0 || idx >= chapters.length) return;
  loadChapter(idx);
}

/*==================================================================
 * [#7] TRAINER FILES — every chapter of the two files (read by
 * filter.js), as data.html saved them in the browser ([#8]).
 * 2 files are held at once, so switching modes never needs a reload.
 *   pools.openings - openings.jsonl (SR, random and Library modes)
 *   pools.puzzles  - puzzles.jsonl (puzzle mode)
 * They're read once, at start-up ([#10]): load new files on
 * data.html first, then open (or reload) the trainer.
 *==================================================================*/
var pools = { openings: [], puzzles: [] };

// Why a slot's saved copy couldn't be used, or "" - shown on the
// empty board ([#9]).
var fileProblems = { openings: "", puzzles: "" };

// A saved file's text -> its slot's pool. data.html only
// saves a file it has checked, so this is only for a copy saved by an
// older trainer (an old .pgn - filter.js [#1]): it's not used, and
// the board says why ([#9]).
function useFile(slot, text, filename) {
  var read = FILTER.read(text, slot);
  if (read.problem) {
    fileProblems[slot] = (filename || "The saved file") + " " + read.problem;
    return;
  }
  pools[slot] = read.chapters;
}

/*==================================================================
 * [#8] FILE CACHE (INDEXEDDB) — where the openings and puzzles files
 * are kept in the browser, each under its own key
 * (FILE_CACHE_KEYS), as { text, filename, savedAt }. data.html
 * puts them there (its Openings and Puzzles buttons); this page
 * only reads them. The files themselves never leave the device.
 *==================================================================*/
var FILE_CACHE_DB = "trainerDB";
var FILE_CACHE_STORE = "files";
var FILE_CACHE_KEYS = { openings: "openings", puzzles: "puzzles" };

function openFileCacheDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(FILE_CACHE_DB, 1);
    req.onupgradeneeded = function (e) {
      e.target.result.createObjectStore(FILE_CACHE_STORE);
    };
    req.onsuccess = function (e) { resolve(e.target.result); };
    req.onerror = function (e) { reject(e.target.error); };
  });
}

function loadCachedFile(slot) {
  return openFileCacheDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(FILE_CACHE_STORE, "readonly");
      var req = tx.objectStore(FILE_CACHE_STORE).get(FILE_CACHE_KEYS[slot]);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  });
}

/*==================================================================
 * [#9] NO FILE YET — what the board says when the current mode's
 * file isn't in the browser: none saved yet (or the browser's data
 * was cleared), or a saved copy that couldn't be used ([#7]). Either
 * way, the fix is on data.html.
 *==================================================================*/
// The data page's file name - here, and for the Settings menu's
// folder button, which opens it ([#21]).
var DATA_PAGE = "data.html";

function noFileText(slot) {
  if (fileProblems[slot]) return fileProblems[slot] + ".";
  return "No " + slot + " file yet. Load " + slot + ".jsonl on " +
    DATA_PAGE + ", then reload this page.";
}

/*==================================================================
 * [#10] STARTUP LOAD — reads both saved files (IndexedDB) at launch,
 * then shows the current mode's list.
 *==================================================================*/
// A slot with nothing saved yet just has an empty pool ([#9]). A
// saved file that can't be read from IndexedDB is a real failure,
// listed in the comment box (and stops the page, like every error).
function startupLoadSlot(slot) {
  return loadCachedFile(slot).then(function (record) {
    if (record && record.text) useFile(slot, record.text, record.filename);
  }, function (err) {
    pageWarn("Could not read the saved " + slot + " file: " + ((err && err.message) || err));
  });
}

function startupLoadFiles() {
  Promise.all([startupLoadSlot("openings"), startupLoadSlot("puzzles")])
    .then(startCurrentList);
}

// Shows the current mode's list, and starts practice if there's
// anything in it.
function startCurrentList() {
  refreshChapterList();
  if (chapters.length) setMode("practice");
}

/*==================================================================
 * GAMEPLAY & APP - sections [#11]-[#25]
 * HOW the open chapter is played - moving through it, practice, the
 * comments and move list beside the board - and the app around it:
 * settings, buttons, keys, start-up.
 *==================================================================*/

/*==================================================================
 * [#11] HELPERS — small tools used all over the page (board.js,
 * engine.js and explorer.js too): el(), a pointerup-first tap binder
 * (to dodge a mobile ghost-click quirk), how far a tap can move, and
 * double-tap-zoom prevention.
 *==================================================================*/
function el(id) { return document.getElementById(id); }

// How far (px) a touch can move and still be a tap - any further and
// it's a drag or a scroll. The one setting for it, everywhere:
//   - the board: a piece pressed and moved further starts dragging it
//     (board.js [#11]); less is a tap, for tap-to-move
//   - the comment box: moved further, it's a scroll, and doesn't tap
//     past a comment ([#23])
//   - a move in an engine line (engine.js "Tapping a move in a line")
//     and a move in the explorer's table (explorer.js [#9]): moved
//     further, it's a scroll, and the move isn't played
var TAP_SLOP = 4;

// An icon from icons.js, for the buttons whose icon the script swaps
// (the mode button, Play/Stop). Every data-icon="..." in the markup
// is checked at boot (errors.js [#3]); these are checked here, when
// they're used. A name icons.js doesn't have is an error.
function icon(name) {
  if (!ICONS[name]) pageWarn('icons.js has no icon named "' + name + '"');
  return ICONS[name] || "";
}

// The >> button turns into Next ([#6]) right as the user finishes a
// move/line - i.e. it changes (and goes from dimmed to tappable)
// inside the same handling as a touch/click gesture that just ended.
// On some mobile browsers a button that changes "mid-gesture"
// like that eats the very next tap (a stale hit-test/ghost-click
// quirk), so the first tap looks like it does nothing and a
// second tap is needed. Binding to "pointerup" (same reliable
// event the board's own drag/tap already uses) instead of "click"
// fires immediately and sidesteps that quirk; the guarded "click"
// fallback keeps keyboard/assistive-tech activation working
// without double-firing when a browser also sends a trailing click.
function bindTap(node, handler) {
  var firedByPointer = false;
  node.addEventListener("pointerup", function (e) {
    firedByPointer = true;
    e.preventDefault();
    handler(e);
  });
  node.addEventListener("click", function (e) {
    if (firedByPointer) { firedByPointer = false; return; }
    handler(e);
  });
}

// NO DOUBLE-TAP ZOOM, anywhere on the page - two rules, both for the
// whole page:
//   1. touch-action: manipulation on every element (trainer.css [#3]).
//      (The meta viewport tag's user-scalable=no is ignored by iPadOS.)
//   2. This guard, because iPadOS doesn't always honour rule 1: a
//      touch that STARTS within DOUBLE_TAP_MS of the last tap ending
//      - the second tap of a double tap - has the iPad's own handling
//      of it cancelled (touchstart), so it can never zoom.
// The second tap is caught as it starts, not as it ends, because the
// start always reaches this listener: the first tap may change what's
// under the finger (a tapped move in an engine line redraws the line),
// and a touch whose element has gone from the page by the time it
// ends is never heard of again - but nothing has changed yet when the
// next touch starts.
// What a cancelled second tap still does: everything handled on
// pointer events (the board, the engine lines, the explorer's moves,
// the comment box, every bindTap button) works as normal. Only the
// browser's own "click" after it is lost, and it can't start a scroll
// - so on the move list, say, two taps on moves in quick succession
// count as one.
// Left alone: buttons, dropdowns, switches and text fields (button,
// select, input, label). Buttons don't zoom anyway (rule 1 works on
// them), and a quick second tap on < or > has to click. A DISABLED
// button lets taps through to what's behind it (trainer.css [#3]) -
// so a quick double tap on a greyed-out button is caught here like
// anywhere else. Every tap's end is noted, buttons' included: tapping
// << goes to the start and disables it straight away, so a quick
// second tap there lands on the button row behind it.
var DOUBLE_TAP_MS = 350;

function preventDoubleTapZoom() {
  var lastTapEnd = 0;
  // (capture: noted before anything the tap does)
  document.addEventListener("pointerup", function (e) {
    if (e.pointerType === "touch") lastTapEnd = Date.now();
  }, true);
  document.addEventListener("touchstart", function (e) {
    if (Date.now() - lastTapEnd > DOUBLE_TAP_MS) return;
    if (e.target.closest && e.target.closest("button, select, input, label")) return;
    e.preventDefault();
  }, { passive: false });
}

/*==================================================================
 * [#12] GAME STATE — where you are in the open chapter, and whether
 * you're practicing or browsing. (Which chapter is open is
 * [#1].)
 *==================================================================*/
var currentPly = 0; // book moves played from the chapter's start
// The position on the board: game.pos (a rules.js Position) and
// game.moves (the moves that led to it, as UCI). Set by
// initGameState() at boot, then by rebuildPosition ([#13]).
var game = { pos: null, moves: [] };
var mode = "practice"; // "browse" | "practice"

// BLINDFOLD PUZZLES - build_puz_jsonl.py merges a Lichess instructions
// chapter and its "Answer" chapter into one puzzle, marked
// "blindfold": true, whose preamble is the instructions. Such
// a puzzle starts with the pieces hidden - an empty board
// (rebuildPosition), the instructions in the comment box, no moves,
// the engine off, and its buttons and keys (l, x) dimmed until the
// pieces show (updateControls, [#13]; engineKey, [#24]). (The explorer
// is off in every puzzle anyway.) Once the pieces show, the comment box is
// empty (the instructions would only be in the way).
// Shown by > (navNext), >> (navEnd), a tap on the comment box or
// Space (passNoteGate); hidden again by << (navStart), or by < at
// the start (navPrev). Only ever on at ply 0.
var piecesHidden = false;

// True if the open chapter is a blindfold puzzle.
function isBlindChapter() {
  var ch = chapters[currentChapter];
  return !!(ch && ch.blindfold);
}

// Creates the starting chess position. Waits until here (rather
// than running at load) so it can run after the rules engine
// (rules.js) is defined.
function initGameState() { game.pos = new RULES.Position(); }

/*==================================================================
 * [#13] NAVIGATION — moves the board to a given ply of the book
 * line: rebuilding the position, the opponent's slide, the
 * back/forward controls and their on/off states.
 *==================================================================*/
function rebuildPosition(ply) {
  // ply 0 is the chapter's own starting position - its fen when it
  // has one, otherwise the standard start.
  var ch = chapters[currentChapter];
  var pos = new RULES.Position((ch && ch.fen) || undefined);
  var moves = [];
  for (var i = 0; i < ply; i++) {
    var r = pos.applyUci(chapterMoves[i].uci);
    if (!r) break;
    moves.push(chapterMoves[i].uci);
  }
  // On the analysis line ([#14]), your own moves follow on from
  // the book position it branched from.
  if (onAnalysisLine() && ply === analysis.basePly) {
    for (var j = 0; j < anaIdx; j++) {
      if (!pos.applyUci(analysis.moves[j].uci)) break;
      moves.push(analysis.moves[j].uci);
    }
  }
  // A blindfold puzzle's hidden pieces ([#12]): the same position with
  // every piece taken off, so the board draws, counts and lets you
  // touch nothing - and the side to move stays the real one.
  if (piecesHidden) pos.board = new Array(128).fill(null);
  game.pos = pos;
  game.moves = moves;
}

// uci "e2e4" -> {from, to} in the same 0x88 square numbering the rest
// of the app uses (see gridTo0x88).
function parseUciSquares(uci) {
  if (!uci || uci.length < 4) return null;
  var ff = uci.charCodeAt(0) - 97, fr = uci.charCodeAt(1) - 49;
  var tf = uci.charCodeAt(2) - 97, tr = uci.charCodeAt(3) - 49;
  if (ff < 0 || ff > 7 || fr < 0 || fr > 7 || tf < 0 || tf > 7 || tr < 0 || tr > 7) return null;
  return { from: fr * 16 + ff, to: tr * 16 + tf };
}

// Stops everything waiting or moving on the board: the pause
// ([#16] - the opponent's reply, or a parked wrong move's trip
// home), the parked wrong move itself (gone at once, no slide back)
// and any slide - the opponent's, or a step on either line. Every
// jump to a new position starts with it, so a fresh navigation
// always wins over whatever was pending or in flight.
function settleBoard() {
  cancelPause();
  BOARD.clearWrongMove(false);
  BOARD.stopAnimation();
  anaSliding = false; // ([#14])
}

function goToPly(ply, skipAnim) {
  // Nothing moves while an error has the page stopped (errors.js [#1]).
  if (pageStopped()) return;
  ply = Math.max(0, Math.min(ply, chapterMoves.length));
  // Going to any move past the start shows a blindfold puzzle's
  // pieces ([#12]) - e.g. >> or a move tapped in the move list.
  if (ply > 0) piecesHidden = false;
  // Slides only make sense from the book position itself, not from
  // your own moves on the analysis line ([#14]).
  var fromBook = !onAnalysisLine();
  anaIdx = 0; // any book-line navigation leaves the analysis line
  settleBoard();

  // One step forward slides the move in; one step back slides it
  // home again (backMove). Bigger jumps are instant. The same in
  // Practice and browse, for both sides' moves - only a move you
  // play on the board yourself doesn't slide (the piece is already
  // where you dropped it), and tryPlayMove ([#16]) asks for that with
  // skipAnim.
  // (No piece on the move's square: a blindfold puzzle's hidden
  // pieces, [#12] - nothing to slide.)
  var animMove = null, backMove = null;
  if (!skipAnim && fromBook) {
    if (ply === currentPly + 1 && currentPly < chapterMoves.length) {
      var parsed = parseUciSquares(chapterMoves[currentPly].uci);
      if (parsed && game.pos.board[parsed.from]) animMove = parsed;
    } else if (ply === currentPly - 1) {
      backMove = parseUciSquares(chapterMoves[ply].uci);
    }
  }

  if (animMove) {
    // Show the comment - and highlight the move in the sidebar list -
    // for the move that's about to land as soon as the animation
    // starts, rather than waiting for the piece to arrive. The player
    // can read the comment while the piece is still sliding toward
    // its target square. The comment box becomes the tap-to-
    // advance target only once the note gate opens after the
    // animation finishes (see maybeAutoPlayBook), so a tap mid-
    // animation doesn't prematurely skip ahead.
    renderCommentText(moveComment(chapterMoves[ply - 1]));
    renderAltText(chapterMoves[ply - 1].altSan);
    commentPly = ply; // ([#18])
    updateMoveListHighlight(ply);
    hideNoteGate();
    // Browse mode: the engine moves on to the new position now, so its
    // lines and arrows switch the moment the step is taken, like
    // Lichess - not once the piece lands (engine.js, "The position
    // analysed"). Going back already works this way.
    if (mode === "browse") {
      var nextPos = game.pos.clone();
      if (nextPos.applyUci(chapterMoves[ply - 1].uci)) {
        ENGINE.positionChanged(nextPos, chapterMoves[ply - 1].uci);
        EXPLORER.positionChanged(nextPos);
      }
    }
    BOARD.animateMove(animMove, ply - 1, function () { finishGoToPly(ply); });
  } else if (backMove) {
    // The board goes straight to the earlier position, and the
    // move's piece slides home over it (board.js [#9]).
    finishGoToPly(ply);
    BOARD.animateMove(backMove, ply, function () { BOARD.render(); }, true);
  } else {
    finishGoToPly(ply);
  }
}

function finishGoToPly(ply) {
  currentPly = ply;
  BOARD.clearSelection();
  rebuildPosition(ply);
  BOARD.render();
  updateMoveListHighlight();
  updateComment();
  updateControls();
  if (currentPly >= chapterMoves.length) {
    hideNoteGate();
    showEndOfLine();
  } else {
    hideEndOfLine();
    maybeAutoPlayBook();
  }
  // Pieces hidden ([#12]): the comment box (or Space) shows them, and
  // the engine and explorer stay off, so nothing gives the position
  // away.
  if (piecesHidden) showNoteGate();
  syncNotesHeight();
  if (piecesHidden) {
    ENGINE.shutDown();
    EXPLORER.shutDown();
  } else {
    ENGINE.positionChanged();
    EXPLORER.positionChanged();
  }
}

// The board's back/forward controls (buttons and arrow keys).
// On the analysis line they step through your own moves; stepping
// back past the first one returns to the book move it branched from.
// Forward from a book position always follows the book.
// Single steps slide on both lines, forward and back, in Practice and
// browse alike (goToPly, goToAnalysis).
function navPrev() {
  // Mid-slide forward: back cancels that move (it hasn't landed yet),
  // not the one before it - on either line. In Practice, only while
  // it's your own move sliding in (from >): cancelling the opponent's
  // reply would just bring it straight back (maybeAutoPlayBook), so
  // there back takes back your move, as it always has.
  if (BOARD.isAnimating() && (mode === "browse" || game.pos.turn === side)) cancelStep();
  else if (onAnalysisLine()) goToAnalysis(anaIdx - 1);
  // At a blindfold puzzle's start: hides the pieces again ([#12]).
  else if (currentPly === 0 && isBlindChapter() && !piecesHidden) hidePieces();
  else goToPly(currentPly - 1);
}
// << : the start - for a blindfold puzzle, with the pieces hidden
// again ([#12]).
function navStart() {
  if (isBlindChapter()) hidePieces();
  else goToPly(0);
}
function hidePieces() {
  piecesHidden = true;
  goToPly(0, true);
}
// snapAnim: a step forward is still sliding in. It lands first - in
// practice that's the whole press (the opponent's reply, or your own
// move from an earlier >); in browse the press then slides the next
// move too, so quick taps never lose a step. Works the same on the
// analysis line.
function navNext(snapAnim) {
  if (snapAnim) {
    landStep();
    if (mode !== "browse") return;
  }
  if (onAnalysisLine()) { goToAnalysis(anaIdx + 1); return; }
  // A blindfold puzzle's hidden pieces: > shows them ([#12]).
  if (piecesHidden) { piecesHidden = false; goToPly(0, true); return; }
  goToPly(currentPly + 1);
}
// A step forward still sliding in (BOARD.isAnimating()), on whichever
// line it's on: landStep puts it on the board at once, cancelStep
// leaves the board where it was before it. (A step onto the analysis
// line always goes from anaIdx to anaIdx + 1 - from 0 at the book
// position it branches from.)
function landStep() {
  if (anaSliding) goToAnalysis(anaIdx + 1, true);
  else goToPly(currentPly + 1, true);
}
function cancelStep() {
  if (anaSliding) goToAnalysis(anaIdx, true);
  else goToPly(currentPly, true);
}
function navEnd() {
  if (onAnalysisLine()) goToAnalysis(analysis.moves.length);
  else goToPly(chapterMoves.length);
}

function updateControls() {
  // On the analysis line, "the end" is the end of your own line.
  var onAna = onAnalysisLine();
  // (A blindfold puzzle's start is the pieces hidden - [#12].)
  var atStart = currentPly === 0 && !onAna && (piecesHidden || !isBlindChapter());
  var atEnd = onAna ? anaIdx >= analysis.moves.length
                    : currentPly >= chapterMoves.length && !piecesHidden;
  el("btnStart").disabled = atStart;
  el("btnPrev").disabled = atStart;
  el("btnNext").disabled = atEnd;
  el("btnEnd").disabled = atEnd;
  // >> as Next at the end of the book line ([#6])
  updateEndButton();
  // A blindfold puzzle's hidden pieces ([#12]): no engine - the board
  // holds no position for it to look at, only an empty one (which it'd
  // call a stalemate). The Threat button dims itself there already
  // (engine.js). The explorer is for openings only: dimmed in Puzzles
  // mode, so no puzzle position is ever asked of Lichess or kept
  // (explorer.js [#7]). (Missing engine.js / explorer.js: their
  // buttons stay off for good - [#22].)
  el("btnEngine").disabled = piecesHidden || !!ENGINE.missing;
  el("btnExplorer").disabled = listSlot() === "puzzles" || !!EXPLORER.missing;
}

/*==================================================================
 * [#14] ANALYSIS LINE — In browse mode you can play moves for
 * both sides. A move that matches the book just steps along the book
 * line. Anything else starts (or extends) ONE analysis line that
 * branches off the book at the position it was played from. Playing
 * a different move from any earlier point replaces the rest of the
 * line; playing off-book from a different book position replaces the
 * whole line. The line shows in brackets in the move list ([#19]).
 *
 * currentPly never leaves the book line: on the analysis line it
 * stays at analysis.basePly, and anaIdx says how many of your own
 * moves are on the board after it (0 = plain book position). That's
 * why going back to the book (goToPly) only has to zero anaIdx.
 *
 * Turning Practice on deletes the line (see setMode in [#15]), and so
 * does loading or restarting a chapter (loadChapter, clearBoard, [#4]).
 *
 * Tapping a move in one of the engine lines ([#22]) plays that
 * line up to the move, by the same rules (playEngineLine below) -
 * and so does tapping a move in the opening explorer, a line of
 * just that one move.
 *==================================================================*/
// { basePly, startTurn, startFull, moves: [{ uci, san }] }
var analysis = null;
var anaIdx = 0;      // how many of analysis.moves are on the board
// True while a step forward along the analysis line is sliding in
// (goToAnalysis): anaIdx is still the step before it until the piece
// lands. Cleared when it lands, and by settleBoard ([#13]).
var anaSliding = false;

function onAnalysisLine() { return anaIdx > 0 && !!analysis; }

function clearAnalysis() {
  analysis = null;
  anaIdx = 0;
}

// A move played on the board in browse mode (from tryPlayMove).
function playFreeMove(m) {
  var uci = game.pos.uciOf(m);
  if (!onAnalysisLine()) {
    var book = chapterMoves[currentPly];
    // (no slide - you just put the piece there yourself)
    if (book && book.uci === uci) { goToPly(currentPly + 1, true); return; }
    // Same first move as the line already branching from here: step
    // into it rather than wiping out the rest of it.
    // (no slide on the analysis line either - here and below)
    if (analysis && analysis.basePly === currentPly && analysis.moves[0].uci === uci) {
      goToAnalysis(1, true);
      return;
    }
    analysis = { basePly: currentPly, startTurn: game.pos.turn, startFull: game.pos.full, moves: [] };
  } else {
    var next = analysis.moves[anaIdx];
    if (next && next.uci === uci) { goToAnalysis(anaIdx + 1, true); return; }
    analysis.moves.length = anaIdx; // drop the old line from here on
  }
  analysis.moves.push({ uci: uci, san: game.pos.sanOf(m) });
  renderMoveList();
  goToAnalysis(analysis.moves.length, true);
}

// A move tapped in one of the engine lines (engine.js). ucis is
// the line from the board position up to and including that move.
// Played by the same rules as moving the pieces on the board one move
// at a time (playFreeMove): moves that match the book just step along
// it, and the first one that doesn't starts - or carries on - the
// analysis line. One move - an explorer move, or the first move of
// an engine line - slides in like a step with > (goToPly,
// goToAnalysis), on either line. More than one jumps straight to the
// last, like tapping a move further along in the move list. Stops
// early at a move that isn't legal (can't happen with engine output,
// but costs nothing to check).
function playEngineLine(ucis) {
  if (mode !== "browse" || !game.pos || !ucis || !ucis.length) return;
  // A step forward still sliding in: the lines are already for the
  // position after it, so land it first.
  if (BOARD.isAnimating()) landStep();
  var pos = game.pos.clone();
  var ply = currentPly, idx = anaIdx, onAna = onAnalysisLine();
  var played = 0, listChanged = false;
  for (var i = 0; i < ucis.length; i++) {
    var legal = pos.legalMoves();
    var m = pos.findUci(ucis[i], legal);
    if (!m) break;
    var uci = pos.uciOf(m);
    if (!onAna) {
      var book = chapterMoves[ply];
      if (book && book.uci === uci) {
        ply++;
      } else {
        onAna = true;
        idx = 1;
        // Same first move as the line already branching from here:
        // step into it rather than wiping out the rest of it.
        if (!(analysis && analysis.basePly === ply && analysis.moves[0].uci === uci)) {
          analysis = { basePly: ply, startTurn: pos.turn, startFull: pos.full,
                       moves: [{ uci: uci, san: pos.sanOf(m, legal) }] };
          listChanged = true;
        }
      }
    } else {
      var next = analysis.moves[idx];
      if (!(next && next.uci === uci)) {
        analysis.moves.length = idx; // drop the old line from here on
        analysis.moves.push({ uci: uci, san: pos.sanOf(m, legal) });
        listChanged = true;
      }
      idx++;
    }
    pos.apply(m);
    played++;
  }
  if (!played) return;
  if (listChanged) renderMoveList();
  // (one move is one step from the board's position, so it slides)
  var skipAnim = played > 1;
  if (onAna) goToAnalysis(idx, skipAnim);
  else goToPly(ply, skipAnim);
}

// Shows the analysis line with its first idx moves played (0 = the
// book position it branches from). The analysis-line counterpart of
// goToPly in [#13], and it slides the same way: one step forward
// slides the move in (slideAnalysisMove), one step back slides it
// home over the earlier position (board.js [#9]); bigger jumps, and
// skipAnim, are instant. The steps count from the book position the
// line branches from too, so the first move slides on and off it.
function goToAnalysis(idx, skipAnim) {
  if (!analysis || pageStopped()) return;
  idx = Math.max(0, Math.min(idx, analysis.moves.length));
  // How many of the line's moves are on the board now: anaIdx on the
  // line, 0 at the book position it branches from, -1 anywhere else
  // (no slide from there).
  var from = onAnalysisLine() ? anaIdx : (currentPly === analysis.basePly ? 0 : -1);
  var step = (skipAnim || from < 0) ? 0 : idx - from;
  if (step === 1) { slideAnalysisMove(idx); return; }
  if (idx === 0) {
    goToPly(analysis.basePly, true);
  } else {
    settleBoard();
    finishGoToAnalysis(idx);
  }
  if (step === -1) {
    // The board is already at the earlier position; the move's piece
    // slides home over it (moveIndex null: not a book move).
    var back = parseUciSquares(analysis.moves[idx].uci);
    if (back) BOARD.animateMove(back, null, function () { BOARD.render(); }, true);
  }
}

// One step forward along the analysis line, to its move idx, slid in
// like a book step (goToPly): the board stays on the position before
// the move until the piece lands, then finishGoToAnalysis puts it
// after. The move list, comment, engine and explorer move on as the
// slide starts. The slide carries the move's SAN and uci, so a check
// glows, and a mate or stalemate gets its badge, from its first frame
// (board.js [#5], [#6]).
function slideAnalysisMove(idx) {
  var mv = analysis.moves[idx - 1];
  var sq = parseUciSquares(mv.uci);
  settleBoard();
  if (!sq || piecesHidden) { finishGoToAnalysis(idx); return; }
  anaSliding = true;
  updateMoveListHighlight(currentPly, idx);
  showAnalysisComment();
  hideNoteGate();
  hideEndOfLine();
  var nextPos = game.pos.clone();
  if (nextPos.applyUci(mv.uci)) {
    ENGINE.positionChanged(nextPos, mv.uci);
    EXPLORER.positionChanged(nextPos);
  }
  sq.san = mv.san;
  sq.uci = mv.uci;
  BOARD.animateMove(sq, null, function () { finishGoToAnalysis(idx); });
}

// The board at the analysis line's move idx (1 or more), with
// everything around it brought up to date.
function finishGoToAnalysis(idx) {
  anaSliding = false;
  anaIdx = idx;
  currentPly = analysis.basePly;
  BOARD.clearSelection();
  rebuildPosition(currentPly);
  BOARD.render();
  updateMoveListHighlight();
  updateComment();
  updateControls();
  hideNoteGate();
  hideEndOfLine();
  syncNotesHeight();
  ENGINE.positionChanged();
  EXPLORER.positionChanged();
}

/*==================================================================
 * [#15] PRACTICE MODE — the Play/Stop button and switching
 * between browse and practice mode.
 *==================================================================*/
// Play/Stop icon for #btnPractice (artwork in icons.js), swapped in
// wholesale (innerHTML) rather than toggling two pre-rendered <svg>
// children, since the button never needs both at once. Play = tap to
// start practice mode; Stop (filled square) = practice is running,
// tap to stop back into browse mode.
function updatePracticeIcon() {
  var btn = el("btnPractice");
  btn.innerHTML = icon(mode === "practice" ? "stop" : "play");
  btn.title = mode === "practice" ? "Stop practice mode" : "Start practice mode";
}

function setMode(next) {
  mode = next;
  // turning Practice on wipes the slate clean - the engine (Engine and
  // Threat) and the explorer shut down and the analysis line is
  // deleted. goToPly below then puts
  // the board back on the book move the analysis line branched from
  // (currentPly never leaves the book line - see [#14]). (The
  // Lichess data carries on being collected - explorer.js [#10].)
  if (mode === "practice") {
    ENGINE.shutDown();
    EXPLORER.shutDown();
    clearAnalysis();
    if (chapters.length) renderMoveList();
  }
  el("btnPractice").classList.toggle("active", mode === "practice");
  updatePracticeIcon();
  el("moveListBox").classList.toggle("hidden", mode === "practice");
  if (mode === "practice") BOARD.setOrientation(side);
  if (chapters.length) goToPly(currentPly, true);
  else BOARD.render(); // nothing loaded (see clearBoard)
  ENGINE.updateUI();
  EXPLORER.updateUI();
}

/*==================================================================
 * [#16] MOVE CHECK & AUTO-PLAY — checks your move against the book
 * (right, an ALT: move, or wrong - a wrong one stays parked on
 * its square for PAUSE_MS, then goes back), then auto-plays the
 * opponent's reply after PAUSE_MS - or first waits for you to tap
 * past your move's comment.
 *==================================================================*/
// While it's genuinely the player's turn, input operates on the real
// game.pos. While the opponent's reply is still pending
// (book move not yet applied - whether still waiting out
// PAUSE_MS or mid-slide-animation), the board still
// accepts input against the position as it WILL be once that reply
// lands - a premove. Picking up a piece doesn't force-resolve the
// opponent's move (so its slide animation, if any, keeps playing);
// only actually dropping the premove on its target square does, via
// playPremove() below. The animOverlay/userDragOverlay split in
// renderMiniBoard is what lets both animations coexist on screen
// without one clobbering the other while this is going on.
function pendingOpponentUci() {
  if (mode !== "practice" || !chapterMoves || currentPly >= chapterMoves.length) return null;
  if (game.pos.turn === side) return null;
  var mv = chapterMoves[currentPly];
  return mv ? mv.uci : null;
}

// Every move the player makes on the board - tapped or dragged
// (board.js [#10], [#11]) - comes here: the board's one handoff to the
// practice rules.
function tryPlayMove(m) {
  if (pageStopped()) return; // see errors.js [#1]
  // (No moves while a blindfold puzzle's pieces are hidden - [#12].
  // The board has none to move anyway.)
  if (piecesHidden) { BOARD.render(); return; }

  // Browse mode never grades a move - it follows the book if
  // it's the book move, otherwise it goes on the analysis line
  // ([#14]).
  if (mode === "browse") { playFreeMove(m); return; }

  // If the opponent's reply hasn't actually landed on the board yet,
  // this is a premove: snap that reply onto the board right now (no
  // further pause, no animation - see playPremove), then re-check
  // the queued move against the real resulting position.
  if (game.pos.turn !== side) { playPremove(m); return; }
  // Your own book move still sliding in from the > button ([#13]): the
  // board is still on the position before it, so a move dropped now
  // isn't checked - it just snaps back, like an illegal drop. (The
  // board takes no input then anyway - board.js inputPosition - so
  // this is only a safety net.)
  if (BOARD.isAnimating()) { BOARD.render(); return; }
  var uci = game.pos.uciOf(m);
  var expected = chapterMoves[currentPly];
  if (expected && expected.uci === uci) {
    // skipAnim: your piece is already where you dropped it, so it
    // doesn't slide (goToPly, [#13])
    goToPly(currentPly + 1, true);
  } else {
    // Wrong (or an ALT: move): park the piece on the square it was
    // dropped on, then slide it home after PAUSE_MS.
    var isAlt = !!(expected && expected.altUci && expected.altUci.indexOf(uci) !== -1);
    BOARD.showWrongMove(m, isAlt);
    BOARD.render();
    pause(function () { BOARD.clearWrongMove(true); });
  }
}

// Resolves a queued premove: fast-forwards the pending opponent book
// move onto the real position - goToPly cuts short the wait or its
// slide animation, whichever is under way - then replays the premove
// against the real legal moves for that new position (re-derived
// from from/to rather than assumed still legal, since the actual
// opponent move is what the board now reflects, not just the
// hypothetical one used to arm the premove). Promotion, if any, was
// already chosen by the player up front (m.promotion) - matched here
// rather than re-asked.
function playPremove(m) {
  if (!pendingOpponentUci()) { BOARD.render(); return; }
  goToPly(currentPly + 1, true);
  if (game.pos.turn !== side) { BOARD.render(); return; }
  var legalNow = game.pos.legalMoves();
  var found = legalNow.filter(function (o) {
    return o.from === m.from && o.to === m.to && (o.promotion || null) === (m.promotion || null);
  });
  if (!found.length) { BOARD.render(); return; }
  tryPlayMove(found[0]);
}

// ---- The pause --------------------------------------------------
// Two things wait PAUSE_MS before they happen:
//   - the opponent's reply, after your move (when your move has no
//     comment - see maybeAutoPlayBook below; the piece then slides
//     across for MOVE_ANIM_MS, board.js [#9])
//   - a wrong or ALT: move's piece and square tint, which stay
//     parked on the dropped square before sliding/fading back home
//     (tryPlayMove above; board.js [#9])
// Both share the one timer below. They can never both be waiting:
// the reply only waits on the opponent's turn, a wrong move only on
// yours, and the turn only changes through goToPly ([#13]), which
// cancels whatever is waiting (settleBoard) - as do goToAnalysis,
// clearBoard and stopGameplay.
var PAUSE_MS = 750;

var pauseTimer = null;
function pause(then) {
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(then, PAUSE_MS);
}
function cancelPause() { clearTimeout(pauseTimer); }

// In practice mode, the side you're NOT playing has no board input
// of its own - its moves come straight from the chapter. After your
// move:
//   - your move has a comment: the trainer waits for you to tap the
//     comment box (or press Space or the next-move button), then
//     plays the opponent's move
//   - no comment - or the comments button off ([#18]), where no
//     comment shows: it pauses (PAUSE_MS), then plays the opponent's
//     move.
// Only ever called from finishGoToPly, right after goToPly has
// cancelled any pause - so there's nothing to cancel here.
function maybeAutoPlayBook() {
  hideNoteGate();
  if (pageStopped() || mode !== "practice" || piecesHidden) return;
  if (currentPly >= chapterMoves.length) return;
  if (game.pos.turn === side) return;
  var justPlayed = currentPly > 0 ? chapterMoves[currentPly - 1] : null;
  if (moveComment(justPlayed)) {
    showNoteGate();
    return;
  }
  pause(function () { goToPly(currentPly + 1); });
}

// True while a just-played move's comment is up and waiting for the
// player to tap the comment box to advance (see maybeAutoPlayBook
// and the commentBox tap handler in [#23]). The ALT box isn't a tap
// target, and there's no separate button for this - the comment box
// itself is the whole tap target, sized to be hard to miss.
var noteGateOpen = false;
function showNoteGate() { noteGateOpen = true; el("commentBox").classList.add("tappable"); }
function hideNoteGate() { noteGateOpen = false; el("commentBox").classList.remove("tappable"); }
// Past the comment that's waiting (a tap on the comment box, or
// Space): plays the next move - or shows a blindfold puzzle's hidden
// pieces ([#12]).
function passNoteGate() {
  if (piecesHidden) navNext();
  else goToPly(currentPly + 1);
}

/*==================================================================
 * [#17] ANNOTATION COLORS — the !!/!/!?/?!/?/?? colors, in one place
 * for the move list ([#19]), the comment text ([#18]) and the board's
 * badges (board.js [#6]). In the comment text, a move with a glyph
 * ("Nf3!", "exd5?!") is found with a regex (a SAN pattern, and a
 * lookahead that tells a glyph from ordinary punctuation) and
 * colored. The comment is built fresh each time it's shown, as one
 * fragment.
 *==================================================================*/
// Single source of truth for the six annotation glyphs: which CSS
// custom property (defined once, at the top of the stylesheet) each
// one maps to. Everything that needs an actual color value - the
// move-list ".mv" classes (via CSS), inline comment text, and the
// on-board badge - reads through annotationColor() below rather than
// keeping its own copy of the hex values.
var ANNOTATION_CLASS = {
  "!!": "brilliant", "!": "good", "!?": "interesting",
  "?!": "dubious", "?": "mistake", "??": "blunder"
};
function annotationColor(glyph) {
  var cls = ANNOTATION_CLASS[glyph];
  return cls ? cssColor("--" + cls) : null;
}

// SAN move core, reused for the move itself and to detect a
// move-list continuation.
var SAN =
  "(?:" +
    "[KQRBN][a-h]?[1-8]?x?[a-h][1-8]" +    // piece move
    "|(?:[a-h]x)?[a-h][1-8](?:=[QRBN])?" + // pawn move
    "|[O0]-[O0](?:-[O0])?" +               // castling
  ")";

// group 1 = boundary char kept as plain text
// group 2 = move + check + glyph (colored)
// group 3 = the glyph (color lookup)
var ANNOTATED_MOVE_REGEX = new RegExp(
  "(^|[^A-Za-z0-9])" +
  "(" +
    SAN +
    "[+#]?" +
    "((?:!!|\\?\\?|!\\?|\\?!|[!?])" +
    "(?=[ \\t]*[^\\w\\s]" +
    "|[ \\t]+[a-z]" +
    "|[ \\t]+(?:[\\d.]+[ \\t]*)?" + SAN +
    "))" +
  ")",
  "g"
);

function buildAnnotatedFragment(text) {
  var frag = document.createDocumentFragment();
  var last = 0, m;
  ANNOTATED_MOVE_REGEX.lastIndex = 0;
  while ((m = ANNOTATED_MOVE_REGEX.exec(text))) {
    var color = annotationColor(m[3]);
    var start = m.index + m[1].length;
    if (!color) continue;
    if (start > last) frag.appendChild(document.createTextNode(text.slice(last, start)));
    var span = document.createElement("span");
    span.style.color = color;
    span.style.fontWeight = "700";
    span.textContent = m[2];
    frag.appendChild(span);
    last = start + m[2].length;
  }
  if (last === 0) { frag.appendChild(document.createTextNode(text)); return frag; }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

/*==================================================================
 * [#18] COMMENT BOX — the comment and ALT box for the move on the
 * board, and the "more below" scroll cue. With the comments
 * button off (toggleComments, below) the move comments are left out
