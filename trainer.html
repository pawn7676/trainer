 * (moveComment, below) - the box itself stays, for everything else
 * it shows.
 * (The circles and arrows that go with each comment are drawn
 * by the board, board.js [#3]. While there's an error, it takes the
 * comment's place - errors.js [#1].)
 * A comment's line breaks come ready-made in the file: the build
 * applies your comma rule on Lichess (jsonl_writer.py [#1]), so
 * "\n" is a plain line break and "\n\n" a blank line, and the box
 * just shows them (white-space: pre-wrap, trainer.css [#13]).
 *==================================================================*/
// "More text below" scroll cue for the comment box - see
// #commentScrollCue's CSS for the visual. The chevron appears once
// #commentText has more than COMMENT_CUE_TOLERANCE px of content
// scrolled out of view below the fold, and fades as the user scrolls
// to the end. The tolerance absorbs the few stray px of overflow a
// fully-visible comment can still report (bottom padding/line-height
// rounding) so a short comment never shows a phantom cue.
var COMMENT_CUE_TOLERANCE = 4;
function syncCommentScrollCue() {
  var box = el("commentText");
  var cue = el("commentScrollCue");
  if (!box || !cue) return;
  var overflow = box.scrollHeight - box.clientHeight;
  if (overflow <= COMMENT_CUE_TOLERANCE) {
    cue.style.display = "none";
    return;
  }
  cue.style.display = "flex";
  var remaining = box.scrollHeight - box.scrollTop - box.clientHeight;
  cue.style.opacity = remaining > COMMENT_CUE_TOLERANCE ? "1" : "0";
}

function renderCommentText(text) {
  var box = el("commentText");
  box.innerHTML = "";
  if (!text) {
    box.className = "empty";
  } else {
    box.appendChild(buildAnnotatedFragment(text));
    box.className = "";
  }
  box.scrollTop = 0;
  syncCommentScrollCue();
}

// The comment box on the analysis line: empty, and the ALT box too -
// the book's comments don't apply there (the move list already shows
// you're off the book, in brackets - [#19]). Also as soon as a step
// onto it starts sliding in (slideAnalysisMove, [#14]).
function showAnalysisComment() {
  renderCommentText("");
  renderAltText(null);
}

function updateComment() {
  // The book's comments don't apply on the analysis line.
  if (onAnalysisLine()) { showAnalysisComment(); return; }
  var moveObj = currentPly === 0 ? null : chapterMoves[currentPly - 1];
  // (A blindfold puzzle shows its instructions only while its pieces
  // are hidden - [#12].)
  var ch = chapters[currentChapter];
  // (The text before move 1 always shows, whatever the comments
  // button says - it's a puzzle's instructions.)
  var text = currentPly === 0
    ? (isBlindChapter() && !piecesHidden ? "" : ch.preamble || "")
    : moveComment(moveObj);
  renderCommentText(text);
  renderAltText(moveObj && moveObj.altSan);
  commentPly = currentPly;
}

// The move whose comment the box shows (0: the start of the line) -
// set by updateComment, and as a step forward starts sliding in,
// before currentPly reaches it (goToPly, [#13]). The comments button
// redraws that comment (applyShowComments, below).
var commentPly = 0;

// A book move's comment as the comment box shows it: "" with
// the comments button off (below). Only the move comments - not the
// text before move 1 (updateComment, above), the ALT box, or the
// messages and errors that take the
// comment's place. The move's arrows and circles stay on the board
// either way: they follow Show move annotations (board.js [#3]).
function moveComment(mv) {
  return showComments && mv ? mv.comment || "" : "";
}

// The comments button switched (below): the comment already showing
// is shown again, or blanked, at once. Not at the start of the line
// (the text before move 1 always shows), and not on the analysis
// line (no book comments there anyway).
// Switched off while a comment is waiting to be tapped past (the note
// gate, [#16]): there's nothing to wait for any more, so the
// opponent's reply is played at once. Switched on, nothing waits that
// wasn't already waiting: the wait only comes after your next move
// that has a comment.
function applyShowComments() {
  if (!chapters.length || pageStopped()) return;
  // commentPly: the move whose comment the box shows - also while a
  // step forward is still sliding in
  var ply = commentPly;
  if (ply > 0 && !onAnalysisLine() && !anaSliding) {
    renderCommentText(moveComment(chapterMoves[ply - 1]));
  }
  if (!showComments && noteGateOpen && !piecesHidden) passNoteGate();
}

// THE COMMENTS BUTTON - the first of the tools under the boxes (a
// speech bubble), and the "c" key ([#24]): the move comments on /
// off. Lit (.active, like the Explorer and Engine buttons) while
// they're on, so it's always plain which it is - even with no comment
// on the screen. Saved with the settings ([#21], "showComments").
// Unlike Explorer, Threat and Engine it doesn't leave Practice: it's
// a setting, not an analysis tool. (It took the place of the Show
// comments switch in the Settings menu.)
function toggleComments() {
  showComments = !showComments;
  saveSetting("showComments", showComments);
  updateCommentsButton();
  applyShowComments();
}
function updateCommentsButton() {
  var btn = el("btnComments");
  btn.classList.toggle("active", showComments);
  btn.title = showComments ? "Hide comments" : "Show comments";
}

// Secondary ALT box (see .alt-row) - the move's other accepted moves
// (its altSan, from the ALT: moves on Lichess). Empty when the
// current move has none, and hidden when there's no room for it
// ([#20]).
function renderAltText(sans) {
  var box = el("altText");
  if (!sans || !sans.length) {
    box.textContent = "";
    box.className = "empty";
    return;
  }
  box.className = "";
  box.textContent = "ALT: " + sans.join(", ");
}

/*==================================================================
 * [#19] MOVE LIST — the sidebar move-pair list (browse
 * mode) and its current-move highlight.
 *==================================================================*/
function renderMoveList() {
  var list = el("moveList");
  list.innerHTML = "";
  if (!chapterMoves.length) return;
  // A chapter that starts from a fen may begin at any move number,
  // and with Black to move. Read both from its starting position; if
  // Black moves first, that move gets a pair of its own ("12... Nf6")
  // and White/Black pairs follow.
  var ch = chapters[currentChapter];
  var start = new RULES.Position((ch && ch.fen) || undefined);
  var moveNo = start.full;
  var white = start.turn !== "b";
  // The analysis line ([#14]) goes in brackets straight after the
  // book move it replaces, as on Lichess. If that was White's move,
  // Black's book reply then starts a pair of its own:
  //   1. e4 e5 2. Nf3 (2. Bc4) 2... Nc6
  var cut = analysis && analysis.moves.length ? analysis.basePly : -1;
  var pair = null;
  for (var i = 0; i < chapterMoves.length; i++) {
    if (white || !pair) {
      pair = appendMovePair(list, moveNo + (white ? "." : "..."));
    } else {
      // A line may break between White's and Black's move
      // (trainer.css [#12])
      pair.appendChild(document.createElement("wbr"));
    }
    pair.appendChild(moveSpan(i));
    if (i === cut) { appendVariation(list); pair = null; }
    if (!white) moveNo++;
    white = !white;
  }
  // A line branching from the end of the book goes last.
  if (cut >= chapterMoves.length) appendVariation(list);
}

// An empty move pair with its number, and the space after it.
function appendMovePair(list, label) {
  var pair = document.createElement("span");
  pair.className = "pair";
  var num = document.createElement("span");
  num.className = "num";
  num.textContent = label;
  pair.appendChild(num);
  list.appendChild(pair);
  list.appendChild(document.createTextNode(" "));
  return pair;
}

// The analysis line in brackets, and the space after it.
function appendVariation(list) {
  var v = document.createElement("span");
  v.className = "variation";
  var open = document.createElement("span");
  open.className = "num";
  open.textContent = "(";
  v.appendChild(open);
  var turn = analysis.startTurn, no = analysis.startFull, pair = null, span = null;
  analysis.moves.forEach(function (mv, i) {
    if (turn === "w" || !pair) {
      if (pair) v.appendChild(document.createTextNode(" "));
      pair = document.createElement("span");
      pair.className = "pair";
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = no + (turn === "w" ? "." : "...");
      pair.appendChild(num);
      v.appendChild(pair);
    } else {
      // Black's move after White's in the same pair - a line
      // may break between them (trainer.css [#12])
      pair.appendChild(document.createElement("wbr"));
    }
    span = document.createElement("span");
    span.className = "mv ana";
    span.textContent = mv.san;
    span.dataset.ana = i + 1;
    span.addEventListener("click", function () {
      goToAnalysis(parseInt(this.dataset.ana, 10));
    });
    pair.appendChild(span);
    if (turn === "b") no++;
    turn = turn === "w" ? "b" : "w";
  });
  span.style.marginRight = "0"; // ")" sits right after the last move
  var close = document.createElement("span");
  close.className = "num";
  close.textContent = ")";
  v.appendChild(close);
  list.appendChild(v);
  list.appendChild(document.createTextNode(" "));
}

function moveSpan(ply) {
  var mv = chapterMoves[ply];
  var span = document.createElement("span");
  span.className = "mv";
  var cls = ANNOTATION_CLASS[mv.annotation];
  if (cls) span.className += " " + cls;
  span.textContent = mv.san + (mv.annotation || "");
  span.dataset.ply = ply + 1;
  span.addEventListener("click", function () {
    goToPly(parseInt(this.dataset.ply, 10));
  });
  return span;
}

// ply / ana: the book move / analysis-line move to highlight - by
// default where the board is now. (Both are given while a step is
// still sliding in, so the move it brings lights up at once.)
function updateMoveListHighlight(ply, ana) {
  if (ply === undefined) ply = currentPly;
  // On the analysis line the highlight is on your own move there
  // (data-ana), not on a book move (data-ply).
  if (ana === undefined) ana = onAnalysisLine() ? anaIdx : 0;
  var onAna = ana > 0;
  var spans = document.querySelectorAll("#moveList .mv");
  spans.forEach(function (s) {
    var isCur = onAna
      ? parseInt(s.dataset.ana, 10) === ana
      : parseInt(s.dataset.ply, 10) === ply;
    s.classList.toggle("current", isCur);
  });
  var cur = onAna
    ? document.querySelector('#moveList .mv[data-ana="' + ana + '"]')
    : (ply > 0 ? document.querySelector('#moveList .mv[data-ply="' + ply + '"]') : null);
  scrollMoveListTo(cur);
}

// Scrolls the move list (it shows --move-list-rows lines, then
// scrolls - trainer.css [#12]) so the current move's line is in view:
// a whole line at a time, so no line is ever cut in half at the top
// or bottom. No current move (the start of the line): back to the
// top, where the first move is. Only the list scrolls - never the
// page around it (which scrollIntoView could do).
function scrollMoveListTo(cur) {
  var list = el("moveList");
  if (!cur) { list.scrollTop = 0; return; }
  var lineH = parseFloat(getComputedStyle(list).lineHeight);
  if (!(lineH > 0)) return;
  // the line the move is on, counted from the list's own top
  var mid = cur.getBoundingClientRect().top + cur.offsetHeight / 2 -
            list.getBoundingClientRect().top + list.scrollTop;
  var lineTop = Math.floor(mid / lineH) * lineH;
  if (lineTop < list.scrollTop) list.scrollTop = lineTop;
  else if (lineTop + lineH > list.scrollTop + list.clientHeight) {
    list.scrollTop = lineTop + lineH - list.clientHeight;
  }
}

/*==================================================================
 * [#20] SIDEBAR HEIGHT — keeps the right-hand column within the
 * board's height when side-by-side, so the two columns bottom-align.
 *
 * The column, top to bottom: the move list, the engine's lines, the
 * explorer (each only while it's on, at its own height), the comment
 * box and the ALT box. When they don't all fit, the column is cut off
 * from the bottom up - the first box that doesn't fit is hidden, and
 * so is everything under it:
 *   - the move list, the engine's lines and the explorer each show
 *     only if there's room for their whole height
 *   - the comment box and the ALT box share whatever room is left:
 *       room for both ....... the ALT box keeps its height, and the
 *                             comment box gets the rest
 *       not room for one line
 *       of comment text plus
 *       the ALT box ......... the ALT box is hidden, and the comment
 *                             box gets its space too
 *       not room for one line
 *       of comment text ..... the comment box is hidden as well
 * So as the room shrinks, the ALT box goes first, then the comment
 * box, the explorer, the engine's lines and the move list.
 * A box hidden for room gets the class "no-room" (trainer.css [#3]),
 * kept apart from "hidden", which says whether it's on at all (set by
 * engine.js, explorer.js, setMode [#15] and applyShowAltBox [#21]) -
 * so a box shows only when it's on AND there's room for it. Hiding it
 * only takes it out of sight: the engine keeps analysing, the
 * explorer keeps asking.
 * Every size is read from the page at the time (trainer.css [#2],
 * [#13]): the boxes' own heights, the comment's font size, line
 * spacing and padding, and --gap.
 *==================================================================*/
// True when the page is in its stacked (phone) layout - the grid has
// one column instead of two. Asks the page itself rather than
// repeating the 820px breakpoint, which lives only in the CSS
// (trainer.css [#16]).
function isStackedLayout() {
  var layout = document.querySelector(".layout");
  if (!layout) return false;
  return getComputedStyle(layout).gridTemplateColumns.trim().split(/\s+/).length < 2;
}

// The boxes above the comment box, top to bottom: the move list, the
// engine's lines and the explorer - also the order they're kept in
// when there isn't room for all of them.
var SIDE_BOXES = ["moveListBox", "engineLines", "explorerBox"];

// The height of the smallest comment box that shows one whole line of
// comment text: the box's padding and border, plus one line of
// #commentText - all from the CSS. (Computed styles are there even
// while the box is hidden.)
function commentOneLineHeight() {
  var box = getComputedStyle(el("commentBox"));
  var text = getComputedStyle(el("commentText"));
  // line-height comes back in px, or as the plain number from
  // --text-line-height (a multiple of the font size)
  var line = parseFloat(text.lineHeight);
  if (!/px$/.test(text.lineHeight)) line *= parseFloat(text.fontSize);
  return line +
    parseFloat(box.paddingTop) + parseFloat(box.paddingBottom) +
    parseFloat(box.borderTopWidth) + parseFloat(box.borderBottomWidth);
}

function syncNotesHeight() {
  var frame = el("boardFrame");
  var comment = el("commentBox");
  var alt = el("altRow");
  var sideCol = document.querySelector(".side-col");
  if (!frame || !comment || !alt) return;
  var boxes = SIDE_BOXES.map(el).filter(Boolean);
  // Stacked (narrow screens): nothing is matched to the board - the
  // comment box is as tall as its text, and nothing is hidden for
  // room.
  if (isStackedLayout()) {
    boxes.concat([comment, alt]).forEach(function (box) { box.classList.remove("no-room"); });
    comment.style.height = "";
    comment.style.minHeight = "";
    syncCommentScrollCue();
    return;
  }
  var boardH = frame.getBoundingClientRect().height;
  if (boardH <= 0) return;
  var gap = sideCol ? (parseFloat(getComputedStyle(sideCol).gap) || 0) : 0;
  // `room`: the room left below the boxes placed so far, each with the
  // gap after it. `fits` turns false at the first box that doesn't
  // fit - it and everything under it are hidden.
  var room = boardH;
  var fits = true;
  // A box hidden for room last time is shown for a moment to be
  // measured, and hidden again here if there's still no room. (A box
  // that's off - "hidden" - is left alone.)
  boxes.forEach(function (box) {
    box.classList.remove("no-room");
    if (box.classList.contains("hidden")) return;
    var h = box.getBoundingClientRect().height;
    if (fits && room >= h) room -= h + gap;
    else fits = false;
    box.classList.toggle("no-room", !fits);
  });
  // The comment box and the ALT box: the ALT box goes first - it
  // shows only if there's room for it, the gap above it, and one line
  // of comment.
  var oneLine = commentOneLineHeight();
  alt.classList.remove("no-room");
  var altOn = !alt.classList.contains("hidden");
  var altH = altOn ? alt.getBoundingClientRect().height : 0;
  var showAlt = fits && altOn && room >= oneLine + gap + altH;
  if (showAlt) room -= altH + gap;
  var showComment = fits && room >= oneLine;
  alt.classList.toggle("no-room", altOn && !showAlt);
  comment.classList.toggle("no-room", !showComment);
  if (showComment) {
    comment.style.height = room + "px";
    comment.style.minHeight = room + "px";
  }
  syncCommentScrollCue();
}

/*==================================================================
 * [#21] SETTINGS — everything saved between visits, in one place:
 * the store itself (localStorage, one entry), the Show...
 * switches and other toggles with their defaults, restoring
 * them all at boot, and the Settings panel (gear menu) that
 * changes them. The board size (board.js [#13]) and the last-open
 * chapter ([#4]) are saved through the same store, and so is the
 * Lichess token - pasted on data.html, read by explorer.js
 * ("THE TOKEN" there). (The engine's
 * settings aren't saved here: they're set in the code, at the top of
 * engine.js.)
 *==================================================================*/
// Small persisted-settings store, backed by localStorage under one
// key so the checkbox states (showAnnotations, showMaterialCount,
// ...), the board size and the rest survive a reload/revisit.
var SETTINGS_KEY = "trainer.settings.v1";
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveSetting(key, value) {
  var s = loadSettings();
  s[key] = value;
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
  catch (e) { /* storage full or off: the setting isn't saved */ }
}

// ---- The toggles: defaults (the saved values replace them at boot)
// !!/?/#/eval badges (board.js [#6]) + circles/arrows
// (board.js [#3]) on the board
var showAnnotations = true;
var showMaterialCount = true; // number in a1/a8 or h1/h8 squares
// the move comments in the comment box (off = blank, and no waiting
// for a tap after your move - moveComment, [#18]). Not a switch in
// the Settings menu: the comments button under the boxes and the "c"
// key change it (toggleComments, [#18]).
var showComments = true;
// the ALT box below the comment box: the move's ALT: moves
var showAltBox = true;
// colored start/end squares for the last move
var showLastMoveHighlight = true;
var showCheckHighlight = true; // red glow around a king in check
// chapter name in the Chapter dropdown (off = just "#N"; the
// Library always shows names - [#5])
var showChapterName = true;
// Auto practice mode: every chapter load (next / previous / pick,
// a new chapter list) turns Practice on - see loadChapter ([#4]).
var autoPractice = true;

// Applies every saved value (if any) onto its variable. Called at
// boot before the board's first paint, so that paint already
// reflects them - and they're what the Settings panel's switches
// start from (wireSettingsPanel, below).
function loadSavedSettings() {
  var saved = loadSettings();
  if ("showAnnotations" in saved) showAnnotations = !!saved.showAnnotations;
  if ("showMaterialCount" in saved) showMaterialCount = !!saved.showMaterialCount;
  if ("showComments" in saved) showComments = !!saved.showComments;
  if ("showAltBox" in saved) showAltBox = !!saved.showAltBox;
  if ("showLastMoveHighlight" in saved) showLastMoveHighlight = !!saved.showLastMoveHighlight;
  if ("showCheckHighlight" in saved) showCheckHighlight = !!saved.showCheckHighlight;
  if ("showChapterName" in saved) showChapterName = !!saved.showChapterName;
  if ("autoPractice" in saved) autoPractice = !!saved.autoPractice;
  // The list mode: spaced repetition, random openings, puzzles or
  // the Library ([#1]).
  if (LIST_MODES.indexOf(saved.listMode) !== -1) listMode = saved.listMode;
  // The Library's color, and each color's study ([#1], [#5]).
  var pick = saved.libraryPick;
  if (pick && (pick.side === "w" || pick.side === "b")) {
    libraryPick.side = pick.side;
    if (typeof pick.w === "string") libraryPick.w = pick.w;
    if (typeof pick.b === "string") libraryPick.b = pick.b;
  }
}

// ---- The Settings panel (gear menu) --------------------------------
// A NEW SWITCH: its row in the Settings panel's markup, its variable
// and default above, its line in loadSavedSettings, and its
// wireSettingsToggle in wireSettingsPanel, below. To give it a key
// too: one line in SETTING_KEYS ([#24]) - see TO ADD A KEY there.
// Wires one settings-panel toggle switch: seeds its checked state
// from the current value of a global var, and on change writes the
// var + localStorage + (optionally) redraws the board so the effect
// is visible immediately without waiting for the next move.
function wireSettingsToggle(checkboxId, getter, setter) {
  var box = el(checkboxId);
  box.checked = !!getter();
  box.addEventListener("change", function () {
    setter(box.checked);
    BOARD.render();
    // (a focused switch would keep the keyboard shortcuts off - [#24])
    box.blur();
  });
}

// Shows/hides the ALT box (see .alt-row) and lets syncNotesHeight()
// re-measure so the comment box immediately reclaims (or gives back)
// the space, rather than waiting for some other layout-triggering
// event to happen to notice.
// (With the switch on, syncNotesHeight still hides it when there's no
// room - [#20].)
function applyShowAltBox() {
  el("altRow").classList.toggle("hidden", !showAltBox);
  syncNotesHeight();
}

// Anchors #settingsPanel's bottom-left corner exactly to the
// board's lower-left corner, so its bottom edge lines up with the
// board's bottom edge - right above the gear button, the first
// button under the board. Recomputed on open and on
// resize/orientation change while the panel is showing, since the
// board can reflow.
function positionSettingsPanel() {
  placeMenu(el("settingsPanel"), el("boardFrame").getBoundingClientRect().left);
}

// Places a pop-up menu (the Settings menu, or the mode menu - [#2])
// with its bottom edge on the board's bottom edge and its left edge
// at `left` (in px from the window's left), kept on screen - at least
// --gap (trainer.css [#2]) from its edges, like the page itself.
// TOO TALL to fit between the top of the screen (less --gap) and the
// board's bottom edge: it stops there and its rows scroll inside,
// under its title, which stays put (trainer.css [#9]) - so it never
// covers the buttons under the board. (If the board's bottom edge is
// off the bottom of the screen, the screen's bottom edge is used
// instead; and if the board has been scrolled almost off the top of
// the screen, leaving less than MENU_MIN_HEIGHT, the menu takes the
// screen's whole height.)
var MENU_MIN_HEIGHT = 240;
function placeMenu(panel, left) {
  var gap = parseFloat(cssVar("--gap", "")) || 0; // (board.js [#2])
  var boardRect = el("boardFrame").getBoundingClientRect();
  var bottom = Math.min(boardRect.bottom, window.innerHeight - gap);
  if (bottom - gap < MENU_MIN_HEIGHT) bottom = window.innerHeight - gap;
  panel.style.left = Math.round(left) + "px";
  panel.style.bottom = Math.round(window.innerHeight - bottom) + "px";
  panel.style.top = "auto";
  panel.style.maxHeight = Math.max(0, Math.round(bottom - gap)) + "px";
  // Clamp so it never runs off the right edge on narrow screens.
  var maxLeft = window.innerWidth - panel.offsetWidth - gap;
  if (parseFloat(panel.style.left) > maxLeft) {
    panel.style.left = Math.max(gap, maxLeft) + "px";
  }
}

function wireSettingsPanel() {
  wireSettingsToggle("toggleAutoPractice",
    function () { return autoPractice; },
    function (v) { autoPractice = v; saveSetting("autoPractice", v); });
  wireSettingsToggle("toggleShowChapterName",
    function () { return showChapterName; },
    function (v) { showChapterName = v; saveSetting("showChapterName", v); populateChapterSelect(); });
  wireSettingsToggle("toggleShowAnnotations",
    function () { return showAnnotations; },
    function (v) { showAnnotations = v; saveSetting("showAnnotations", v); });
  wireSettingsToggle("toggleShowMaterialCount",
    function () { return showMaterialCount; },
    function (v) { showMaterialCount = v; saveSetting("showMaterialCount", v); });
  wireSettingsToggle("toggleShowAltBox",
    function () { return showAltBox; },
    function (v) { showAltBox = v; saveSetting("showAltBox", v); applyShowAltBox(); });
  wireSettingsToggle("toggleShowLastMoveHighlight",
    function () { return showLastMoveHighlight; },
    function (v) { showLastMoveHighlight = v; saveSetting("showLastMoveHighlight", v); });
  wireSettingsToggle("toggleShowCheckHighlight",
    function () { return showCheckHighlight; },
    function (v) { showCheckHighlight = v; saveSetting("showCheckHighlight", v); });

  el("dateNavPrev").addEventListener("click", function () { shiftSRViewDate(-1); });
  el("dateNavNext").addEventListener("click", function () { shiftSRViewDate(1); });
  // Tapping the date label itself is a shortcut back to today,
  // rather than clicking "next" over and over from several days back.
  el("dateNavLabel").addEventListener("click", function () {
    if (!isViewingToday()) {
      srViewDate = realToday();
      updateDateNavUI();
      if (listMode === "sr") refreshChapterList();
    }
  });
  updateDateNavUI();

  el("btnSettings").addEventListener("click", function () {
    el("settingsBackdrop").classList.remove("hidden");
    positionSettingsPanel();
    el("settingsPanel").scrollTop = 0; // (opens at the top every time)
  });
  // The folder button, on the title's row: the data page, in this tab
  // (DATA_PAGE, [#9]). Back comes back here, as it was left - reload
  // to pick up files loaded there. (It may not work from a local
  // server that sends a page only once.)
  el("btnDataPage").addEventListener("click", function () {
    window.location.href = DATA_PAGE;
  });
  // Tapping outside the menu closes it. Uses "click" on purpose:
  // closing any earlier lets the tap go through to whatever is
  // underneath, so tapping the gear would close the menu and then
  // open it again.
  el("settingsBackdrop").addEventListener("click", function (e) {
    if (e.target === el("settingsBackdrop")) el("settingsBackdrop").classList.add("hidden");
  });
  el("settingsPanel").addEventListener("click", function (e) { e.stopPropagation(); });
  window.addEventListener("resize", function () {
    if (!el("settingsBackdrop").classList.contains("hidden")) positionSettingsPanel();
  });
}

/*==================================================================
 * [#22] ENGINE & EXPLORER — The Stockfish engine lives in engine.js
 * and the Lichess opening explorer (with the background data
 * collection) in explorer.js (both loaded before this script, like
 * rules.js).
 *
 * The trainer only ever talks to the engine through the ENGINE
 * object:
 *   ENGINE.init() ............ once, from boot
 *   ENGINE.positionChanged() . the board position changed
 *   ENGINE.drawArrows() ...... from renderMiniBoard
 *   ENGINE.shutDown() ........ Practice on / nothing loaded (turns
 *                              Engine and Threat off; Stockfish stays
 *                              loaded, idle)
 *   ENGINE.updateUI() ........ refresh the Engine and Threat buttons
 *                              and the lines
 *   ENGINE.toggle() / .toggleThreat()
 *                              the Engine and Threat buttons and the
 *                              "l" and "x" keys ([#23], [#24]) - only
 *                              one of them on at a time
 *   ENGINE.toggleArrows() .... the "a" key ([#24])
 * In the other direction, engine.js calls playEngineLine ([#14])
 * when a move in one of its lines is tapped (a tap being a touch that
 * moved no more than TAP_SLOP, [#11]), and reports any error through
 * pageWarn (errors.js [#1]), which stops the page.
 *
 * ...and to the explorer through the EXPLORER object:
 *   EXPLORER.init() ............ once, from boot
 *   EXPLORER.positionChanged() . the board position changed (with
 *                                the same calls as the engine's)
 *   EXPLORER.updateUI() ........ Practice on / off (redraws it)
 *   EXPLORER.shutDown() ........ Practice on / the page stopped by
 *                                an error (turns it off)
 *   EXPLORER.toggle() .......... the "e" key ([#24])
 *   EXPLORER.chapterOpened(ch) . a chapter opened ([#4]): an
 *                                opening chapter, or null (a puzzle,
 *                                or nothing - the explorer turns off)
 * In the other direction, explorer.js calls playEngineLine ([#14])
 * when one of its moves is tapped (TAP_SLOP too), and todayString
 * ([#3]) to date its answers. When Lichess can't answer
 * it just says so on its own line; that isn't a page error.
 *
 * If engine.js or explorer.js is missing, the file check stops the
 * page (errors.js [#3]); these do-nothing stand-ins just keep the
 * rest of the page from failing on the way there.
 *==================================================================*/
if (typeof ENGINE === "undefined") {
  window.ENGINE = {
    missing: true, // checked by checkExternalFiles (errors.js [#3])
    init: function () {
      ["btnEngine", "btnThreat"].forEach(function (id) { el(id).disabled = true; });
      el("btnEngine").title = "engine.js is missing";
    },
    positionChanged: function () {},
    drawArrows: function () {},
    shutDown: function () {},
    updateUI: function () {},
    toggle: function () {},
    toggleThreat: function () {},
    toggleArrows: function () {}
  };
}
if (typeof EXPLORER === "undefined") {
  window.EXPLORER = {
    missing: true, // checked by checkExternalFiles (errors.js [#3])
    init: function () {
      el("btnExplorer").disabled = true;
      el("btnExplorer").title = "explorer.js is missing";
    },
    positionChanged: function () {},
    updateUI: function () {},
    shutDown: function () {},
    toggle: function () {},
    chapterOpened: function () {}
  };
}

/*==================================================================
 * [#23] BUTTON WIRING — every button, dropdown and on-screen
 * control, except the Settings panel's ([#21]), the engine lines
 * (engine.js) and the explorer's table (explorer.js).
 *==================================================================*/
function wireUI() {
  updateListModeButton();
  buildModeMenu();
  wireModeMenu();
  updatePracticeIcon();
  wireSettingsPanel();

  el("btnStart").addEventListener("click", navStart);
  el("btnPrev").addEventListener("click", navPrev);
  el("btnNext").addEventListener("click", function () {
    // If the opponent's move is still sliding, currentPly hasn't
    // advanced yet and its target IS currentPly + 1 - so a click here
    // just snaps that in-flight animation straight to completion
    // instead of restarting a fresh one on top of it.
    navNext(BOARD.isAnimating());
  });
  // >> - or Next at the end of a line ([#6]). On pointerup
  // (bindTap, [#11]): it turns into Next in the middle of a gesture.
  bindTap(el("btnEnd"), endButton);
  el("btnPractice").addEventListener("click", togglePractice);
  el("chapterSel").addEventListener("change", function () {
    loadChapter(parseInt(this.value, 10));
    this.blur();
  });
  // the Library's color square and Study dropdown ([#5])
  el("libraryColor").addEventListener("click", switchLibraryColor);
  el("libraryStudy").addEventListener("change", function () {
    pickLibraryStudy(this.value);
    this.blur();
  });
  el("btnChapterLink").addEventListener("click", openChapterLink);
  // The comment box itself is the "tap to advance" target while the
  // note gate is up ([#16]). Any other time - the end of a line
  // included (only >> goes on to the next chapter, [#6]) - tapping the
  // comment does nothing.
  // Scrolling is never a tap: a touch that moved more than TAP_SLOP
  // ([#11]), or scrolled the comment, between going down and coming
  // up does nothing - so reading a long comment can't play the next
  // move.
  var commentDown = null;
  el("commentBox").addEventListener("pointerdown", function (e) {
    commentDown = { x: e.clientX, y: e.clientY, scroll: el("commentText").scrollTop };
  });
  bindTap(el("commentBox"), function (e) {
    var d = commentDown;
    commentDown = null;
    // (with an error showing, it isn't a tap target at all -
    // errors.js [#1])
    if (pageStopped()) return;
    if (e.type === "pointerup" && (!d || el("commentText").scrollTop !== d.scroll ||
        Math.abs(e.clientX - d.x) > TAP_SLOP || Math.abs(e.clientY - d.y) > TAP_SLOP)) return;
    if (noteGateOpen) passNoteGate();
  });
  // While the promotion picker is up, pressing anywhere other than
  // one of its piece choices - the dimmed board, a nav button, the
  // sidebar, anywhere on the page - cancels the promotion without
  // playing anything, same as clicking away from it on Lichess.
  // Whatever was pressed still does its own job (the forward button
  // still steps forward, and so on). Listens in the capture phase so
  // it sees every press before any other handler can stop it.
  document.addEventListener("pointerdown", function (e) {
    if (el("promoPicker").classList.contains("hidden")) return;
    if (e.target.closest && e.target.closest(".promotion-piece")) return;
    BOARD.closePromoPicker();
  }, true);
  // the mode button opens the mode menu ([#2])
  el("btnListMode").addEventListener("click", openModeMenu);
  // the comments button - same as the "c" key ([#18], [#24]); lit
  // to match the saved setting from the start
  updateCommentsButton();
  el("btnComments").addEventListener("click", toggleComments);
  // the explorer button - same as the "e" key ([#24])
  el("btnExplorer").addEventListener("click", explorerKey);
  // the Threat and Engine buttons - same as the "x" and "l" keys
  // ([#24]); turning one on turns the other off
  el("btnThreat").addEventListener("click", function () { engineKey(true); });
  el("btnEngine").addEventListener("click", function () { engineKey(false); });
}

// The Play/Stop button and the "t" key ([#24]): Practice on or off.
// Turning it on deletes the analysis line and shuts the engine off
// (setMode, [#15]).
function togglePractice() {
  setMode(mode === "practice" ? "browse" : "practice");
}

/*==================================================================
 * [#24] KEYBOARD SHORTCUTS — every key the trainer responds to,
 * all wired here and nowhere else (while an error has the page
 * stopped, errors.js [#1] keeps every key from getting here).
 * README.md lists the same keys (Keyboard shortcuts) - a new or
 * changed key goes there too:
 *
 *   Left / Right arrow ... previous / next move (on the analysis
 *                          line, through your own moves)
 *   p / n ................ previous / next chapter, as on Lichess. No
 *                          wraparound: p on the first chapter and n
 *                          on the last do nothing.
 *   t .................... practice mode on / off ("train") - same as
 *                          tapping the Play/Stop button. Turning
 *                          Practice on deletes the analysis line and
 *                          shuts the engine off, like the button.
 *   Space ................ continue past a comment - same as tapping
 *                          the comment box while it's waiting (also
 *                          shows a blindfold puzzle's hidden pieces,
 *                          [#12]).
 *   l .................... Engine on / off - same as tapping the
 *                          Engine button (the chip). Turns Threat off
 *                          if it was on. In Practice mode: leaves
 *                          Practice mode and turns the engine on, in
 *                          one go.
 *   x .................... Threat on / off - same as tapping the
 *                          Threat button (the crosshair). Turns the
 *                          engine off if it was on; turning Threat
 *                          off leaves both off. In Practice mode:
 *                          leaves Practice and turns Threat on
 *                          (nothing while the side to move is in
 *                          check, where the button is dimmed).
 *                          Turning either off never goes back into
 *                          Practice.
 *   a .................... engine arrows on / off (threat arrows
 *                          too); the lines stay. Only while Engine or
 *                          Threat is on. Not saved: arrows are back on
 *                          when the page opens.
 *   e .................... opening explorer on / off - same as
 *                          tapping the explorer button (as on
 *                          Lichess). In Practice mode: leaves
 *                          Practice mode and turns the explorer on,
 *                          in one go. Turning Practice on turns the
 *                          explorer off, like the engine.
 *   c .................... comments on / off - same as tapping the
 *                          comments button (the speech bubble,
 *                          toggleComments, [#18]): saved, and the
 *                          button lights up while they're on. Turned
 *                          off while a comment is waiting to be
 *                          tapped past, the opponent's reply is
 *                          played at once (applyShowComments,
 *                          [#18]). Unlike e, l and x, it doesn't
 *                          leave Practice.
 *   m .................... Settings > Show material count on / off -
 *                          the same as tapping its switch. (With equal
 *                          material there's no number to show, so the
 *                          board doesn't change until it isn't.)
 *   b .................... Settings > Show move annotations on / off
 *                          ("b" for badges) - the badges, and the
 *                          chapter's arrows and circles with them
 *                          (board.js [#3], [#6]). Not the engine's
 *                          arrows - that's "a".
 *   i .................... Settings > Show chapter name on / off ("i"
 *                          for ID) - the names in the Chapter
 *                          dropdown, or just "#N" (the Library always
 *                          shows names - [#5]).
 *   o .................... Settings > Show ALT box on / off ("o" for
 *                          other moves) - the box under the comment
 *                          box with the move's ALT: moves
 *                          (applyShowAltBox, [#21]).
 * (m, b, i and o are the SETTING KEYS - see below. Each one shows
 * as "[m]" just left of its switch in the Settings menu.)
 *
 * While a blindfold puzzle's pieces are hidden ([#12]), l, x and e do
 * nothing, like the Engine, Threat and explorer buttons, which are
 * dimmed. (c and the SETTING KEYS still work there.)
 *
 * Shift does nothing: with Shift or Caps Lock on, the letter keys
 * (P, N, T, L, X, A, E, C and the SETTING KEYS) do nothing. Holding a
 * letter key or Space down acts once, not over and over; the arrow
 * keys do repeat while held.
 *
 * No shortcut does anything when:
 *   - a text field or one of the chapter row's dropdowns has focus
 *   - Cmd, Ctrl or Option is held, so browser shortcuts like Cmd+N
 *     (new window) and Cmd+P (print) still work normally
 *   - the Settings menu, the mode menu or the promotion picker is
 *     open - except a SETTING KEY (below) with the Settings menu
 *     open: it flips one of that menu's own switches, so you see the
 *     switch move right there
 *   - no chapters are loaded yet
 *
 * SETTING KEYS - a key that flips a Settings switch (m, b, i, o)
 * is ONE line in SETTING_KEYS, below: the key, and its switch's
 * checkbox id. That line alone wires it (settingKey - the same as
 * tapping the switch), lets it work with the Settings menu open,
 * makes holding it act once, and shows "[m]" just left of the
 * switch in the menu (showSettingKeyHints). No case in
 * wireKeyboardShortcuts, and nothing to add to the menu's markup.
 *
 * TO ADD A KEY:
 *   1. Pick one nobody uses - the list above is every key taken.
 *   2. For a Settings switch: its line in SETTING_KEYS. For anything
 *      else: a case in wireKeyboardShortcuts (copy "e" -
 *      preventDefault, and !keyEvent.repeat so holding it acts once).
 *   3. Its line in the list above (and for a Settings switch, its
 *      letter in the SETTING KEYS line there).
 *   4. Its row in README.md (Keyboard shortcuts).
 * A key meant to work with the mode menu or the promotion picker
 * open needs an exception of its own in shortcutsBlocked, the way
 * SETTING_KEYS has one for the Settings menu.
 *==================================================================*/
// SETTING KEYS (above): a key -> the checkbox id of the Settings
// switch it flips (the ids are in the Settings panel's markup, at the
// top of this page). These keys also work with the Settings menu
// open (shortcutsBlocked).
var SETTING_KEYS = {
  m: "toggleShowMaterialCount",  // Show material count
  b: "toggleShowAnnotations",    // Show move annotations (badges)
  i: "toggleShowChapterName",    // Show chapter name (ID)
  o: "toggleShowAltBox"          // Show ALT box (other moves)
};

// Each SETTING KEY shown in the Settings menu, "[m]", just left of
// its switch - all of them in one column, so the menu says which key
// flips which switch. Made from SETTING_KEYS, once, at boot
// (wireKeyboardShortcuts), so the menu can never show a key that
// isn't wired, or miss one that is. Its look and place: .key-hint in
// trainer.css [#9]. (It's inside the row's <label>, so tapping it
// flips the switch too, like the rest of the row.)
function showSettingKeyHints() {
  Object.keys(SETTING_KEYS).forEach(function (key) {
    var row = el(SETTING_KEYS[key]).closest(".settings-row");
    var sw = row && row.querySelector(".switch");
    if (!sw) return;
    var hint = document.createElement("span");
    hint.className = "key-hint";
    hint.textContent = "[" + key + "]";
    row.insertBefore(hint, sw);
  });
}

function shortcutsBlocked(e) {
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return true;
  if (e.metaKey || e.ctrlKey || e.altKey) return true;
  if (!el("settingsBackdrop").classList.contains("hidden") &&
      !SETTING_KEYS.hasOwnProperty(e.key)) return true;
  if (modeMenuOpen()) return true;
  if (!el("promoPicker").classList.contains("hidden")) return true;
  if (!chapters.length) return true;
  return false;
}

// The Engine and Threat buttons ([#23]) and the "l" (engine) and "x"
// (threat) keys - only one of the two is ever on, so turning one on
// turns the other off (engine.js). In browse mode they just do that. In Practice mode - where both are always off -
// they first leave Practice, then turn theirs on. Nothing while the
// button is dimmed: the Threat button where there's no threat to
// show (in check), both while a blindfold puzzle's pieces are hidden
// ([#12]), and both with no engine.js.
function engineKey(threat) {
  if (ENGINE.missing) return; // no engine.js - nothing to turn on
  if (piecesHidden) return;   // a blindfold puzzle's hidden pieces ([#12])
  if (el(threat ? "btnThreat" : "btnEngine").disabled) return;
  if (mode === "practice") setMode("browse");
  if (threat) ENGINE.toggleThreat();
  else ENGINE.toggle();
}

// the "e" key and the explorer button under the board ([#23]). In
// browse mode: explorer on / off. In Practice mode - where the
// explorer is always off - it leaves Practice and turns the explorer
// on, in one go. Nothing while the button is dimmed (updateControls,
// [#13]): Puzzles mode, or no explorer.js.
function explorerKey() {
  if (el("btnExplorer").disabled) return;
  if (mode === "practice") setMode("browse");
  EXPLORER.toggle();
  // Refit the column beside the board ([#20]). Usually its
  // ResizeObserver does that by itself, but not when the explorer was
  // already hidden for lack of room: turning it off then changes no
  // box's size, so nothing would notice the room it gives back.
  syncNotesHeight();
}

// A SETTING KEY (SETTING_KEYS, above - "m", "b"...): flips a Settings
// switch (its checkbox's id) exactly as tapping it does - its own
// change handler (wireSettingsToggle, [#21]) saves it, applies it
// and redraws the board, and the switch in the menu shows the new
// state - moving right there if the menu is open. One path for both,
// so the key and the switch can never disagree.
function settingKey(checkboxId) {
  var box = el(checkboxId);
  box.checked = !box.checked;
  box.dispatchEvent(new Event("change"));
}

function wireKeyboardShortcuts() {
  showSettingKeyHints();
  document.addEventListener("keydown", function onShortcutKeydown(keyEvent) {
    if (shortcutsBlocked(keyEvent)) return;
    // a key that flips a Settings switch (SETTING_KEYS) - no case of
    // its own below
    if (SETTING_KEYS.hasOwnProperty(keyEvent.key)) {
      keyEvent.preventDefault();
      if (!keyEvent.repeat) settingKey(SETTING_KEYS[keyEvent.key]);
      return;
    }
    switch (keyEvent.key) {
      case "ArrowLeft":
        keyEvent.preventDefault();
        navPrev();
        break;
      case "ArrowRight":
        keyEvent.preventDefault();
        // Mid-slide, this snaps the opponent's move to its end
        // instead of starting a new animation on top of it (same as
        // btnNext).
        navNext(BOARD.isAnimating());
        break;
      case "p":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) stepChapter(-1);
        break;
      case "n":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) stepChapter(1);
        break;
      case "t":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) togglePractice();
        break;
      case "l":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) engineKey(false);
        break;
      case "x":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) engineKey(true);
        break;
      case "a":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) ENGINE.toggleArrows();
        break;
      case "c":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) toggleComments();
        break;
      case "e":
        keyEvent.preventDefault();
        if (!keyEvent.repeat) explorerKey();
        break;
      case " ":
        // Always claimed, so Space never scrolls the page. Only does
        // something while a comment is waiting to be tapped past.
        keyEvent.preventDefault();
        if (!keyEvent.repeat && noteGateOpen) passNoteGate();
        break;
    }
  });
  // A button that was just clicked keeps keyboard focus, and the
  // browser "presses" a focused button when Space is released. Block
  // that, so Space only ever means "continue" and never also re-fires
  // whichever button was clicked last (e.g. Next).
  document.addEventListener("keyup", function (e) {
    if (e.key === " " && !shortcutsBlocked(e)) e.preventDefault();
  });
}

/*==================================================================
 * [#25] BOOT & STOP — boot runs once, on DOMContentLoaded, in
 * dependency order. stopGameplay is its opposite: what an
 * error does to the game (errors.js [#1]).
 *==================================================================*/
function boot() {
  if (!checkExternalFiles()) return;
  initGameState();
  loadSavedSettings();
  BOARD.init();
  wireUI();
  wireKeyboardShortcuts();
  applyShowAltBox();
  wireDayChange();
  preventDoubleTapZoom();

  startupLoadFiles();

  // engine.js wires the taps on its lines and brings its saved copy
  // of the Stockfish files up to date straight away, while the
  // server that sent this page is sure to be answering. (Stockfish
  // itself only loads the first time Engine or Threat is turned on,
  // then stays loaded.)
  ENGINE.init();

  // explorer.js wires its table, and reads the Lichess token and the
  // answers saved in the browser.
  EXPLORER.init();

  syncNotesHeight();
  window.addEventListener("resize", syncNotesHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(syncNotesHeight).observe(document.getElementById("boardFrame"));
    // also whenever one of the boxes above the comment box changes
    // height - an analysis line wrapping onto another row, the
    // engine's lines or a message appearing, the explorer's table
    // coming and going - so the comment box always re-fits
    // and the sidebar never runs past the bottom of the board.
    // (Showing or hiding one is a height change too - also when
    // syncNotesHeight hides one for room ([#20]): the browser then
    // checks it again a frame later, and says so with a
    // "ResizeObserver loop" message, which errors.js [#2] passes
    // over.)
    ["moveListBox", "engineLines", "explorerBox"].forEach(function (id) {
      new ResizeObserver(syncNotesHeight).observe(document.getElementById(id));
    });
    // and whenever the page grid itself changes size - the layout
    // switching between side-by-side and stacked while the board
    // stays the same size. Safari's sidebar does that: opening it
    // stacks the page, closing it puts the column back, and Safari
    // doesn't always say the window was resized.
    new ResizeObserver(syncNotesHeight).observe(document.querySelector(".layout"));
  }
  // Keep the "more below" chevron in sync as the user scrolls the
  // comment box themselves (fades out once they reach the bottom).
  el("commentText").addEventListener("scroll", syncCommentScrollCue, { passive: true });
}

document.addEventListener("DOMContentLoaded", boot);

// Called by errors.js [#1] when an error comes in: every timer,
// slide, menu, engine search and explorer request stops. After
// that, goToPly, goToAnalysis, loadChapter, tryPlayMove and the
// auto-play all check pageStopped() and do nothing, so the game
// can't start up again until the page is reloaded. (Not
// settleBoard: a parked wrong move is left where it is rather than
// redrawn while the page stops.)
function stopGameplay() {
  cancelPause();
  hideNoteGate();
  BOARD.stopAnimation();
  BOARD.closePromoPicker();
  ENGINE.shutDown();
  EXPLORER.shutDown();
  el("settingsBackdrop").classList.add("hidden");
  closeModeMenu();
}
</script>
</body>
</html>
