<!doctype html>

<!-- index.html - the site's front door. It only sends you on
     to trainer.html, so the short address
     (pawn7676.github.io/trainer/) opens the trainer. Without
     it, GitHub Pages shows README.md here instead.

     The page itself stays trainer.html: it's the one to
     bookmark, and the one the data page's Back button returns
     to. Nothing else needs this file - locally, open
     trainer.html as before. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trainer</title>
<!-- the fallback, if scripts are off -->
<meta http-equiv="refresh" content="0; url=trainer.html">
<script>location.replace("trainer.html");</script>
<!-- the trainer's own colors (trainer.css --bg, --text-muted,
     --accent-bright), so there is no white flash -->
<style>
  body { background: #161512; color: #8a8a86;
         font-family: system-ui, sans-serif; padding: 24px; }
  a { color: #5d7a9c; }
</style>
</head>
<body>
<p><a href="trainer.html">Open the trainer</a></p>
</body>
</html>
